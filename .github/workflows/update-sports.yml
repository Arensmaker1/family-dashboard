name: Update Family Dashboard Sports

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-sports.yml"

permissions:
  contents: write

jobs:
  update-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Fetch Sports Center data
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          TEAMS = [
              {"key":"lions","name":"Detroit Lions","shortName":"Lions","emoji":"🦁","sport":"football","league":"nfl","teamId":"8","abbr":"DET"},
              {"key":"tigers","name":"Detroit Tigers","shortName":"Tigers","emoji":"🐯","sport":"baseball","league":"mlb","teamId":"6","abbr":"DET"},
              {"key":"pistons","name":"Detroit Pistons","shortName":"Pistons","emoji":"🏀","sport":"basketball","league":"nba","teamId":"8","abbr":"DET"},
              {"key":"redwings","name":"Detroit Red Wings","shortName":"Red Wings","emoji":"🏒","sport":"hockey","league":"nhl","teamId":"5","abbr":"DET"},
              {"key":"notredame","name":"Notre Dame Football","shortName":"Notre Dame","emoji":"☘️","sport":"football","league":"college-football","teamId":"87","abbr":"ND"},
              {"key":"msubasketball","name":"Michigan State Basketball","shortName":"Michigan State","emoji":"🏀","sport":"basketball","league":"mens-college-basketball","teamId":"127","abbr":"MSU"},
          ]

          def parse_dt(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z","+00:00"))
              except Exception:
                  return None

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 FamilyDashboardSports/9.3.8",
                      "Accept":"application/json,text/plain,*/*",
                      "Accept-Language":"en-US,en;q=0.9",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          def normalize_event(cfg, event):
              try:
                  comp = (event.get("competitions") or [None])[0]
                  if not comp:
                      return None
                  competitors = comp.get("competitors") or []
                  if len(competitors) < 2:
                      return None

                  ours = next((c for c in competitors if str((c.get("team") or {}).get("id","")) == str(cfg["teamId"])), None)
                  if ours is None:
                      ours = next((c for c in competitors if str((c.get("team") or {}).get("abbreviation","")).upper() == cfg["abbr"].upper()), None)
                  if ours is None:
                      return None

                  opp = next((c for c in competitors if c is not ours), {})
                  typ = ((comp.get("status") or {}).get("type") or {})
                  state = str(typ.get("state") or "pre")
                  completed = bool(typ.get("completed")) or state == "post"
                  status_name = str(typ.get("name") or "").upper()
                  cancelled = "CANCEL" in status_name or "POSTPON" in status_name

                  ours_score = "" if ours.get("score") is None else str(ours.get("score"))
                  opp_score = "" if opp.get("score") is None else str(opp.get("score"))
                  result = ""
                  if completed and ours_score != "" and opp_score != "":
                      try:
                          a, b = float(ours_score), float(opp_score)
                          result = "W" if a > b else "L" if a < b else "T"
                      except Exception:
                          pass

                  broadcasts = []
                  for b in comp.get("broadcasts") or []:
                      broadcasts.extend(b.get("names") or [])

                  opp_team = opp.get("team") or {}
                  return {
                      "id": str(event.get("id") or ""),
                      "date": event.get("date") or comp.get("date") or "",
                      "name": event.get("name") or "",
                      "shortName": event.get("shortName") or event.get("name") or "",
                      "opponent": opp_team.get("shortDisplayName") or opp_team.get("displayName") or opp_team.get("name") or "Opponent",
                      "opponentAbbr": opp_team.get("abbreviation") or "",
                      "homeAway": ours.get("homeAway") or "",
                      "state": state,
                      "completed": completed,
                      "cancelled": cancelled,
                      "status": typ.get("shortDetail") or typ.get("detail") or typ.get("description") or "",
                      "ourScore": ours_score,
                      "opponentScore": opp_score,
                      "result": result,
                      "winner": bool(ours.get("winner")) if completed else None,
                      "venue": ((comp.get("venue") or {}).get("fullName") or ""),
                      "broadcast": ", ".join(dict.fromkeys(broadcasts)),
                  }
              except Exception:
                  return None

          now = datetime.now(timezone.utc)
          date_from = (now - timedelta(days=21)).strftime("%Y%m%d")
          date_to = (now + timedelta(days=35)).strftime("%Y%m%d")
          date_range = f"{date_from}-{date_to}"

          league_cache = {}
          normalized_teams = []

          for cfg in TEAMS:
              league_key = (cfg["sport"], cfg["league"])
              try:
                  if league_key not in league_cache:
                      url = (
                          "https://site.api.espn.com/apis/site/v2/sports/"
                          + urllib.parse.quote(cfg["sport"])
                          + "/"
                          + urllib.parse.quote(cfg["league"])
                          + "/scoreboard?limit=1000&dates="
                          + date_range
                      )
                      league_cache[league_key] = fetch_json(url)

                  data = league_cache[league_key]
                  team_events = []
                  for event in data.get("events") or []:
                      comp = (event.get("competitions") or [None])[0] or {}
                      competitors = comp.get("competitors") or []
                      matches = any(
                          str((c.get("team") or {}).get("id","")) == str(cfg["teamId"])
                          or str((c.get("team") or {}).get("abbreviation","")).upper() == cfg["abbr"].upper()
                          for c in competitors
                      )
                      if matches:
                          item = normalize_event(cfg, event)
                          if item:
                              team_events.append(item)

                  team_events.sort(key=lambda e: parse_dt(e.get("date")) or datetime.min.replace(tzinfo=timezone.utc))

                  live = next((e for e in team_events if e.get("state") == "in"), None)

                  past = [
                      e for e in team_events
                      if e.get("completed")
                      and (parse_dt(e.get("date")) or now) <= now
                  ]
                  last = sorted(
                      past,
                      key=lambda e: parse_dt(e.get("date")) or datetime.min.replace(tzinfo=timezone.utc),
                      reverse=True,
                  )[0] if past else None

                  next_game = None
                  for e in team_events:
                      dt = parse_dt(e.get("date"))
                      if (
                          not e.get("completed")
                          and e.get("state") != "in"
                          and not e.get("cancelled")
                          and dt is not None
                          and dt >= now - timedelta(hours=3)
                      ):
                          next_game = e
                          break

                  season = ""
                  season_obj = data.get("season") or {}
                  if isinstance(season_obj, dict):
                      season = season_obj.get("displayName") or ""

                  normalized_teams.append({
                      "key": cfg["key"],
                      "name": cfg["name"],
                      "shortName": cfg["shortName"],
                      "emoji": cfg["emoji"],
                      "league": cfg["league"],
                      "ok": True,
                      "live": live,
                      "last": last,
                      "next": next_game,
                      "season": season,
                      "record": "",
                      "eventCount": len(team_events),
                  })

              except Exception as exc:
                  normalized_teams.append({
                      "key": cfg["key"],
                      "name": cfg["name"],
                      "shortName": cfg["shortName"],
                      "emoji": cfg["emoji"],
                      "league": cfg["league"],
                      "ok": False,
                      "error": str(exc),
                      "live": None,
                      "last": None,
                      "next": None,
                  })

          any_ok = any(t.get("ok") for t in normalized_teams)
          payload = {
              "ok": any_ok,
              "teams": normalized_teams,
              "source": "ESPN public scoreboard via GitHub Actions",
              "message": "" if any_ok else " | ".join(
                  f'{t["shortName"]}: {t.get("error","unknown error")}' for t in normalized_teams
              ),
          }

          path = "sports-data.json"
          previous = None
          if os.path.exists(path):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      previous = json.load(f)
              except Exception:
                  previous = None

          previous_compare = dict(previous or {})
          previous_compare.pop("updatedAt", None)
          if previous_compare == payload:
              print("Sports data unchanged.")
              sys.exit(0)

          payload["updatedAt"] = datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("sports-data.json updated.")

      - name: Commit updated sports data
        run: |
          if git diff --quiet -- sports-data.json; then
            echo "No sports changes to commit."
            exit 0
          fi

          git config user.name "family-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports-data.json
          git commit -m "Update dashboard sports data"
          git push
