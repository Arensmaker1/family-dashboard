<script>
/* ============================================================
   V8.16 GITHUB PAGES -> APPS SCRIPT BACKEND COMPATIBILITY BRIDGE
   ============================================================

   STEP AFTER DEPLOYING THE UPDATED APPS SCRIPT PROJECT:
   Replace the placeholder below with the /exec web-app URL.
*/
const FAMILY_DASHBOARD_APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyg7NHXQNPKpZL6Ys4ZVZvrMCbhMsa41QbX6qxOQwWWO_iNhhx2QIzpPiveN4RCGPbKxQ/exec";

(function installAppsScriptBridge_(){
  const pending = new Map();
  const queued = [];
  let bridgeReady = false;
  let seq = 0;

  const bridge = document.createElement("iframe");
  bridge.id = "appsScriptBridge";
  bridge.setAttribute("aria-hidden", "true");
  bridge.style.cssText =
    "position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0;pointer-events:none;";

  function backendConfigured_(){
    return /^https:\/\/script\.google\.com\/.+\/exec(?:$|\?)/.test(FAMILY_DASHBOARD_APPS_SCRIPT_URL);
  }

  function bridgeUrl_(){
    const join = FAMILY_DASHBOARD_APPS_SCRIPT_URL.includes("?") ? "&" : "?";
    return FAMILY_DASHBOARD_APPS_SCRIPT_URL + join + "bridge=1";
  }

  function post_(payload){
    if(!bridge.contentWindow) throw new Error("Family Dashboard backend bridge is not ready.");
    // The Apps Script HTML page itself verifies that requests came from
    // https://arensmaker1.github.io, so no secret is embedded in GitHub.
    bridge.contentWindow.postMessage(payload, "*");
  }

  function flush_(){
    while(bridgeReady && queued.length){
      post_(queued.shift());
    }
  }

  window.addEventListener("message", function(event){
    if(event.source !== bridge.contentWindow) return;

    const msg = event.data || {};
    if(msg.type === "fd-bridge-ready"){
      bridgeReady = true;
      flush_();
      return;
    }

    if(msg.type !== "fd-api-result" || !msg.id) return;

    const job = pending.get(msg.id);
    if(!job) return;
    pending.delete(msg.id);
    clearTimeout(job.timer);

    if(msg.ok){
      try{ job.success && job.success(msg.result); }catch(err){ console.error(err); }
    }else{
      const err = new Error(msg.error?.message || "Apps Script backend error");
      err.name = msg.error?.name || "Error";
      try{
        if(job.failure) job.failure(err);
        else console.error("Family Dashboard backend error:", err);
      }catch(handlerErr){
        console.error(handlerErr);
      }
    }
  });

  function callBackend_(method, args, success, failure){
    if(!backendConfigured_()){
      const err = new Error(
        "V8.16 backend is not configured yet. Paste the Apps Script /exec URL into FAMILY_DASHBOARD_APPS_SCRIPT_URL."
      );
      if(failure) setTimeout(() => failure(err), 0);
      else console.error(err);
      return;
    }

    const id = "fd-" + Date.now() + "-" + (++seq);
    const payload = {type:"fd-api-call", id, method, args:Array.from(args || [])};

    const timer = setTimeout(function(){
      pending.delete(id);
      const err = new Error("Family Dashboard backend timed out while calling " + method + ".");
      if(failure) failure(err);
      else console.error(err);
    }, 45000);

    pending.set(id, {success, failure, timer});

    if(bridgeReady) post_(payload);
    else queued.push(payload);
  }

  function makeRunner_(){
    let success = null;
    let failure = null;
    let proxy;

    proxy = new Proxy({}, {
      get(_target, prop){
        if(prop === "withSuccessHandler"){
          return function(fn){ success = fn; return proxy; };
        }
        if(prop === "withFailureHandler"){
          return function(fn){ failure = fn; return proxy; };
        }
        if(prop === "withUserObject"){
          // Current V8.15.2 does not use this, but retaining chain compatibility
          // makes the shim safer for future Apps Script-style calls.
          return function(){ return proxy; };
        }
        if(typeof prop === "symbol") return undefined;

        return function(...args){
          callBackend_(String(prop), args, success, failure);
        };
      }
    });

    return proxy;
  }

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, "run", {
    configurable: true,
    get: makeRunner_
  });

  function mountBridge_(){
    if(!backendConfigured_()){
      console.warn("Family Dashboard V8.16: Apps Script backend URL still needs to be configured.");
      return;
    }
    bridge.src = bridgeUrl_();
    document.body.appendChild(bridge);
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", mountBridge_, {once:true});
  }else{
    mountBridge_();
  }
})();
</script>

function dinnerForDate_(d){
 let iso=key(d),x=(S.mealPlanWeek||[]).find(v=>v.date===iso);
 if(x&&x.dinner)return {name:x.dinner,id:x.dinnerId||"",source:"plan",planName:x.planName||"Meal Plan"};
 x=(S.randomDinnerWeek||[]).find(v=>v.date===iso);
 if(x&&x.dinner)return {name:x.dinner,id:x.id||x.dinnerId||"",source:"library",planName:"Build My Week"};
 let keys=["SUN","MON","TUE","WED","THU","FRI","SAT"],raw=String(S.menu?.[keys[d.getDay()]]||"").trim();
 if(!raw)return null;
 let m=raw.match(/(?:🌙\s*)?([^•]+)$/),name=(m?m[1]:raw).replace(/^🌙\s*/,"").trim();
 return name?{name:name,id:"",source:"",planName:"Weekly Menu"}:null;
}
function recipeMatchForDinner_(dinner){
 if(!dinner)return null;
 if(dinner.id){
   let pool=dinner.source==="plan"?(MP.recipes||[]):(R.recipes||[]),x=pool.find(r=>String(r.id)===String(dinner.id));
   if(x)return {source:dinner.source,id:x.id,recipe:x};
 }
 let n=String(dinner.name||"").toLowerCase().replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim();
 for(let source of ["library","plan"]){
   let pool=source==="library"?(R.recipes||[]):(MP.recipes||[]);
   let x=pool.find(r=>String(r.name||"").toLowerCase().replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim()===n);
   if(x)return {source,id:x.id,recipe:x};
 }
 return null;
}
function groceryNeedForRecipe_(recipe){
 if(!recipe||!G||!Array.isArray(G.items))return null;
 let parts=cookIngredients_(recipe.ingredients||"").map(x=>x.toLowerCase()),active=G.items.filter(x=>!x.checked);
 let missing=0;
 parts.forEach(line=>{let words=line.replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!/^(cup|cups|tbsp|tsp|tablespoon|teaspoon|ounce|ounces|pound|pounds|clove|cloves|large|small|medium|fresh|minced|chopped|diced|sliced|ground|optional|taste)$/.test(w));if(words.length&&!active.some(g=>{let gn=String(g.name||"").toLowerCase();return words.slice(-2).some(w=>gn.includes(w))}))missing++});
 return {missing,total:parts.length};
}

 if(!jobs&&cb)cb();
}

function durationMinutesFromText_(text){
 let s=String(text||"").toLowerCase(),total=0,found=[];
 let re=/\b(?:for\s+|about\s+|approximately\s+|approx\.?\s+|roughly\s+|around\s+)?(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min)\b/g,m;
 while((m=re.exec(s))){let n=Number(m[1]),mins=/^h/.test(m[2])?n*60:n;if(mins>0&&mins<=1440)found.push(mins)}
 if(!found.length)return null;
 // Recipe steps usually contain sequential durations; cap absurd totals.
 total=found.reduce((a,b)=>a+b,0);return Math.min(total,1440);
}
function formatCookEstimate_(mins){if(!mins)return "";if(mins>=240)return mins>=480?"Long cook":`~${Math.round(mins/60)} hr`;if(mins>=60){let h=Math.floor(mins/60),m=Math.round((mins%60)/5)*5;return `~${h} hr${m?" "+m+" min":""}`}return `~${Math.max(5,Math.round(mins/5)*5)} min`}
function prepIntelForRecipe_(recipe){
 let s=[recipe?.ingredients,recipe?.instructions,recipe?.notes].filter(Boolean).join(" ").toLowerCase(),hits=[];
 if(/\bovernight\b/.test(s))hits.push("overnight prep");
 if(/\b(?:marinate|marinade)\b/.test(s)){let m=s.match(/(?:marinate|marinade)[^.!;\n]{0,80}?(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min)/);hits.push(m?`marinate ${m[1]} ${m[2]}`:"marinate ahead")}
 if(/\bthaw|defrost\b/.test(s))hits.push("thaw ahead");
 if(/\bsoak\b/.test(s))hits.push("soak ahead");
 if(/\bbrine\b/.test(s))hits.push("brine ahead");
 if(/\brefrigerat(?:e|ed)[^.!;\n]{0,60}?\d+\s*(?:hours?|hrs?|hr|minutes?|mins?|min)/.test(s)){let m=s.match(/refrigerat(?:e|ed)[^.!;\n]{0,60}?(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min)/);if(m)hits.push(`chill ${m[1]} ${m[2]}`)}
 return [...new Set(hits)].slice(0,2);
}
function busyEveningIntel_(d){

}
function kitchenIntelHtml_(d,m){

}
function dinnerCommandHtml_(d){

 let sub=m?(need?(need.missing?`<span class="dinnerMissing">🛒 ${need.missing} ingredient${need.missing===1?"":"s"} may still be needed</span>`:`<span class="dinnerReady">✓ Grocery list looks covered</span>`):"Recipe ready"):"No linked recipe found yet";

function simpleRecipeCategory_(cat,name,tags){let c=String(cat||"").trim().toLowerCase(),blob=[c,name||"",tags||""].join(" ").toLowerCase();if(/breakfast|brunch|egg|pancake|waffle|oatmeal/.test(c))return "Breakfast";if(/dessert|sweet|cake|cookie|pie|brownie|candy|ice cream/.test(c))return "Desserts";if(/sauce|condiment|dressing|marinade|rub|seasoning|crema|chimichurri|salsa|gravy/.test(c))return "Sauces";if(/app|appetizer|starter|snack|dip|finger food/.test(c))return "Apps";if(/soup|stew|chowder|bisque|salad/.test(c))return "Soups & Salads";if(/side|vegetable|veggie|potato|rice|bread|slaw/.test(c))return "Sides";if(/drink|beverage|cocktail|mocktail|smoothie|shake/.test(c))return "Drinks";if(/main|dinner|entree|entrée|beef|chicken|pork|turkey|seafood|fish|shrimp|steak|bbq|barbecue|smoker|grill|mexican|italian|asian|casserole|pasta|sandwich|burger|taco|pizza/.test(c)||/\b(chicken|beef|pork|steak|fish|shrimp|turkey|salmon|taco|burger|pasta|pizza)\b/.test(blob))return "Mains";return "Other"}

function recipeScaleFor_(source,id){let n=Number(recipeScales[recipeScaleKey_(source,id)]||1);return [0.5,1,1.5,2,3].includes(n)?n:1}
function saveRecipeScales_(){try{localStorage.setItem(RECIPE_SCALE_KEY,JSON.stringify(recipeScales))}catch(e){}}
function formatScaledQty_(n){if(!isFinite(n))return "";let whole=Math.floor(n+1e-9),frac=n-whole,fracs=[[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[.667,"⅔"],[.75,"¾"],[.875,"⅞"]],best=fracs.reduce((a,b)=>Math.abs(frac-b[0])<Math.abs(frac-a[0])?b:a,[0,""]);if(Math.abs(frac-best[0])>.035)return String(Math.round(n*100)/100);return (whole?whole+" ":"")+best[1]||String(whole)}
function scaleIngredientLine_(line,factor){if(factor===1)return line;let s=String(line||""),m=s.match(/^(\s*)(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])(?=\s|$)/);if(!m)return s;let n=cookNum_(m[2].replace("⅓",".333").replace("⅔",".667").replace("⅛",".125").replace("⅜",".375").replace("⅝",".625").replace("⅞",".875"));if(!isFinite(n))return s;return m[1]+formatScaledQty_(n*factor)+s.slice(m[0].length)}
function scaleIngredientText_(text,factor){return String(text||"").split("\n").map(x=>scaleIngredientLine_(x,factor)).join("\n")}
function recipeScaleControlsHtml_(source,id){let cur=recipeScaleFor_(source,id);return `<span>Scale</span>${[[.5,"½×"],[1,"1×"],[1.5,"1½×"],[2,"2×"],[3,"3×"]].map(x=>`<button class="btn ${cur===x[0]?"active":""}" onclick="setRecipeScale_('${source}','${esc(id)}',${x[0]},this)">${x[1]}</button>`).join("")}`}
function setRecipeScale_(source,id,factor,btn){recipeScales[recipeScaleKey_(source,id)]=Number(factor)||1;saveRecipeScales_();let bar=btn?.closest(".recipeScaleBar");bar?.querySelectorAll(".btn").forEach(b=>b.classList.remove("active"));btn?.classList.add("active");let x=source==="plan"?(MP.recipes||[]).find(r=>String(r.id)===String(id)):(R.recipes||[]).find(r=>String(r.id)===String(id)),e=document.getElementById("recipeScaledIngredients");if(x&&e)e.textContent=scaleIngredientText_(x.ingredients||"—",factor)}

function renderRecipeLibrary(){let b=document.getElementById("recipeBody"),q=(document.getElementById("recipeSearch")?.value||"").trim().toLowerCase(),cat=document.getElementById("recipeCategory")?.value||"";let a=(R.recipes||[]).filter(x=>(!cat||recipeDisplayCategory_(x)===cat)&&(!q||[x.name,x.category,recipeDisplayCategory_(x),x.tags,x.status].join(" ").toLowerCase().includes(q)));if(!a.length){b.innerHTML='<div class="rEmpty">No recipes found. The kitchen goblins searched everywhere.</div>';return}b.innerHTML=`${recentCookedHtml_()}<div class="rMeta" style="margin:0 0 8px">${a.length} recipe${a.length===1?"":"s"}</div><div class="recipeGrid">${a.map(x=>`<div class="recipeCard" onclick="openRecipeDetail('${esc(x.id)}')"><h3>${esc(x.name)}</h3><div class="rMeta">${esc(recipeDisplayCategory_(x))}${x.yield?` • ${esc(x.yield)}`:""}${x.status?` • ${esc(x.status)}`:""}</div>${x.tags?`<div class="rTags">${esc(x.tags)}</div>`:""}</div>`).join("")}</div>`}

function importCleanLines_(raw){return String(raw||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean)}
function importIsIngredient_(x){return /^(?:[-•*]\s*)?(?:(?:\d+\s+)?\d+\/\d+|\d+(?:\.\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞]|one|two|three|four|five|six|a\s|an\s|pinch\b|dash\b|salt\b|pepper\b)/i.test(x)&&!/^\d+[.)]\s+[A-Z][a-z]+\s+(?:the|a|an)\b/.test(x)}
function importIsStep_(x){return /^(?:step\s*)?\d+[.)\-:]\s*/i.test(x)||/^(?:preheat|heat|add|combine|mix|stir|whisk|cook|bake|roast|grill|smoke|place|pour|season|remove|transfer|reduce|bring|cover|uncover|serve|let|rest|chill|refrigerate|fold|beat|slice|cut)\b/i.test(x)}
function guessImportCategory_(name,ingredients,raw){let b=[name,ingredients,raw].join(" ").toLowerCase();if(/breakfast|brunch|pancake|waffle|oatmeal|frittata|breakfast burrito/.test(b))return "Breakfast";if(/cake|cookie|brownie|pie|dessert|frosting|ice cream|pudding|cheesecake/.test(b))return "Desserts";if(/\b(sauce|chimichurri|crema|dressing|marinade|rub|seasoning|gravy|salsa)\b/.test(name.toLowerCase()))return "Sauces";if(/\b(appetizer|dip|crostini|bruschetta|deviled egg|slider)\b/.test(b))return "Apps";if(/\b(soup|chowder|bisque|salad)\b/.test(name.toLowerCase()))return "Soups & Salads";if(/\b(side|slaw|mashed|potatoes|vegetables|corn|rice|stuffing)\b/.test(name.toLowerCase()))return "Sides";if(/\b(cocktail|mocktail|drink|smoothie|lemonade)\b/.test(name.toLowerCase()))return "Drinks";return "Mains"}
function parseRecipeImport_(raw){let lines=importCleanLines_(raw),name="",yieldText="",ingredients=[],steps=[],notes=[],mode="";let heads=/^(ingredients?|what you(?:'|’)ll need)\s*:?$/i,stepHeads=/^(instructions?|directions?|method|preparation|steps?)\s*:?$/i,noteHeads=/^(notes?|tips?)\s*:?$/i;for(let i=0;i<lines.length;i++){let x=lines[i];if(heads.test(x)){mode="ing";continue}if(stepHeads.test(x)){mode="step";continue}if(noteHeads.test(x)){mode="note";continue}if(!name&&i<3&&!/^(prep|cook|total)\s*time/i.test(x)&&x.length<100){name=x.replace(/^#+\s*/,"");continue}if(!yieldText&&/^(?:yield|serves?|servings?)\s*:?\s*/i.test(x)){yieldText=x.replace(/^(?:yield|serves?|servings?)\s*:?\s*/i,"");if(/^\d/.test(yieldText))yieldText="Serves "+yieldText;continue}if(/^(?:prep|cook|total)\s*time\s*:/i.test(x)){notes.push(x);continue}if(mode==="ing"){if(importIsStep_(x)&&ingredients.length){mode="step";steps.push(x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""));continue}ingredients.push(x.replace(/^[-•*]\s*/,""));continue}if(mode==="step"){steps.push(x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""));continue}if(mode==="note"){notes.push(x);continue}if(importIsIngredient_(x)&&!steps.length){ingredients.push(x.replace(/^[-•*]\s*/,""));mode="ing"}else if(importIsStep_(x)){steps.push(x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""));mode="step"}else notes.push(x)}if(!ingredients.length||!steps.length){let split=lines.findIndex(x=>stepHeads.test(x));if(split>0){let h=lines.findIndex(x=>heads.test(x));if(h>=0)ingredients=lines.slice(h+1,split).map(x=>x.replace(/^[-•*]\s*/,""));steps=lines.slice(split+1).filter(x=>!noteHeads.test(x)).map(x=>x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""))}}return {name:name||"Imported Recipe",category:guessImportCategory_(name,ingredients.join(" "),raw),yield:yieldText,tags:"",status:"",variantOf:"",ingredients:ingredients.join("\n"),instructions:steps.join("\n"),notes:notes.join("\n"),imported:true}}
function parseRecipeImportUI(){let raw=document.getElementById("recipeImportText")?.value||"";if(raw.trim().length<20){alert("Paste a little more of the recipe first.");return}let d=parseRecipeImport_(raw);openRecipeEditor(null,false,d)}

es||[]).find(r=>r.id===res.id);if(saved)openRecipeDetail(saved.id);else renderRecipeLibrary()}).withFailureHandler(e=>recipeDataFail(e.message||e)).getRecipeLibrary()}).withFailureHandler(e=>{saveDone=true;clearTimeout(watchdog);clearTimeout(hardWatch);alert("Couldn’t save recipe: "+(e.message||e));if(btn){btn.disabled=false;btn.textContent="💾 Save Recipe"}if(state)state.textContent="Save failed."}).saveRecipe(payload)}

let voiceRecognition=null,voiceSessionEnd=0,voiceSessionUnlimited=false,voiceSessionTick=null,voiceWanted=false,voiceSpeaking=false;
function voiceSupported_(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function speak_(text){text=String(text||"").trim();if(!text||!("speechSynthesis" in window))return;
 voiceSpeaking=true;
 // Never let the dashboard hear its own voice.
 try{if(voiceRecognition){voiceRecognition.abort();voiceRecognition=null}}catch(e){}
 try{
   speechSynthesis.cancel();
   let u=new SpeechSynthesisUtterance(text);u.rate=1;
   let finish=()=>{voiceSpeaking=false;if(voiceWanted&&!window._voiceQuick)setTimeout(ensureVoiceListening_,250)};
   u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);
 }catch(e){voiceSpeaking=false;if(voiceWanted&&!window._voiceQuick)setTimeout(ensureVoiceListening_,250)}
}
function openVoiceControl(){if(!voiceSupported_()){openModal('<h2>🎙️ Voice Assistant</h2><div class="rError">Speech recognition is not available in this browser. Use Chrome on the kitchen PC.</div><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>');return}openModal(`<h2>🎙️ Voice Assistant</h2><div class="note">Quick Listen hears one command. Voice Session keeps listening temporarily while you cook.</div><div class="voiceChoices"><button class="btn primaryAction" onclick="startVoiceSession(0,true)">Quick Listen</button><button class="btn" onclick="startVoiceSession(5)">5 min</button><button class="btn" onclick="startVoiceSession(10)">10 min</button><button class="btn" onclick="startVoiceSession(30)">30 min</button><button class="btn" onclick="startVoiceSession(45)">45 min</button><button class="btn" onclick="startVoiceSession(60)">60 min</button><button class="btn" onclick="startVoiceSession(-1)">Until I Stop It</button></div><div class="voiceHelp"><b>Try:</b> “What’s for dinner?” • “Read this step” • “Next step” • “Repeat” • “Start a 10 minute timer” • “How much garlic?” • “Add milk to groceries” • “What’s on the calendar today?” • “Stop listening”</div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function startVoiceSession(minutes,quick=false){
 closeModal();stopVoiceSession(false);
 voiceWanted=true;voiceSessionUnlimited=minutes<0;
 voiceSessionEnd=quick?Date.now()+90000:(voiceSessionUnlimited?0:Date.now()+Math.max(1,minutes)*60000);
 window._voiceQuick=quick;
 updateVoiceUI_();
 voiceSessionTick=setInterval(updateVoiceUI_,1000);
 // IMPORTANT: Chrome wants recognition.start() directly from the tap/click gesture.
 // Do not speak first and delay microphone startup.
 ensureVoiceListening_();
}
function stopVoiceSession(announce=false){voiceWanted=false;voiceSessionUnlimited=false;voiceSessionEnd=0;window._voiceQuick=false;clearInterval(voiceSessionTick);voiceSessionTick=null;try{voiceRecognition?.stop()}catch(e){}voiceRecognition=null;updateVoiceUI_();if(announce)speak_("Voice session ended.")}
function updateVoiceUI_(){if(voiceWanted&&!voiceSessionUnlimited&&Date.now()>=voiceSessionEnd){stopVoiceSession(false);speak_("Voice session ended.");return}document.getElementById("voiceFab")?.classList.toggle("listening",voiceWanted);document.getElementById("voiceNavBtn")?.classList.toggle("active",voiceWanted);let vl=document.getElementById("voiceNavLabel");if(vl)vl.textContent=voiceWanted?"Listening":"Voice";document.getElementById("voiceSessionBar")?.classList.toggle("open",voiceWanted);let e=document.getElementById("voiceSessionTime");if(e&&voiceWanted)e.textContent=voiceSessionUnlimited?"Until stopped":fmtTimer(voiceSessionEnd-Date.now());if(!voiceWanted){setVoiceState_("🎙️ Ready");let t=document.getElementById("voiceTranscript");if(t)t.textContent=""}}
function setVoiceState_(text,error=false){
 let s=document.getElementById("voiceState"),bar=document.getElementById("voiceSessionBar");
 if(s)s.textContent=text;
 if(bar)bar.classList.toggle("error",!!error);
}
function ensureVoiceListening_(){
 if(!voiceWanted||voiceSpeaking||voiceRecognition)return;
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){setVoiceState_("🎙️ Unsupported",true);return}
 let r=new SR();voiceRecognition=r;
 r.lang="en-US";r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
 r.onstart=()=>setVoiceState_("🎙️ Listening");
 r.onspeechstart=()=>setVoiceState_("🎙️ Hearing you…");
 r.onresult=e=>{
   let text=e.results?.[0]?.[0]?.transcript||"";
   let t=document.getElementById("voiceTranscript");if(t)t.textContent=text?`“${text}”`:"";
   setVoiceState_("✓ Heard");
   handleVoiceCommand_(text);
   if(window._voiceQuick)setTimeout(()=>stopVoiceSession(false),700);
 };
 r.onerror=e=>{
   let code=e?.error||"unknown";
   console.warn("Voice recognition error:",code,e);
   if(code==="not-allowed"||code==="service-not-allowed"){
     voiceWanted=false;updateVoiceUI_();setVoiceState_("Mic permission blocked",true);
     alert("Chrome blocked microphone access for the dashboard. Click the site controls icon by the address bar, allow Microphone, then reload.");
     return;
   }
   if(code==="audio-capture"){setVoiceState_("No microphone found",true);return}
   if(code==="network"){setVoiceState_("Voice service unavailable",true);return}
   if(code==="no-speech"){setVoiceState_("🎙️ Listening");return}
   setVoiceState_("Voice error: "+code,true);
 };
 r.onend=()=>{
   if(voiceRecognition===r)voiceRecognition=null;
   if(voiceWanted&&!voiceSpeaking&&!window._voiceQuick)setTimeout(ensureVoiceListening_,250);
 };
 try{r.start()}catch(e){
   console.warn("Voice start failed",e);voiceRecognition=null;
   setVoiceState_("Could not start mic",true);
 }
}
function setVoiceDuration_(m){m=Number(m)||10;voiceSessionUnlimited=false;voiceSessionEnd=Date.now()+m*60000;window._voiceQuick=false;updateVoiceUI_();speak_(`I'll keep listening for ${m} minutes.`)}
function voiceDinner_(){let d=dinnerForDate_(new Date());return d?`Tonight is ${d.name}.`:"I don't see dinner planned for tonight."}

function voiceAddGroceries_(raw){let a=raw.split(/\s*(?:,|\band\b)\s*/i).filter(Boolean).slice(0,8),left=a.length;if(!left)return;speak_(`Adding ${left} item${left===1?"":"s"} to groceries.`);a.forEach(n=>google.script.run.withSuccessHandler(g=>{G=g;if(--left===0&&document.getElementById("groceryOverlay")?.classList.contains("open"))renderGroceries()}).addGroceryItem(n,guessGroceryCategory(n),""))}

function handleVoiceCommand_(raw){let s=String(raw).toLowerCase().replace(/[?.!]/g,"").trim(),m;if(/stop listening|voice off|microphone off/.test(s)){stopVoiceSession(false);speak_("Voice session ended.");return}if((m=s.match(/keep listening(?: for)? (\d+) (?:minutes?|mins?)/))){setVoiceDuration_(m[1]);return}if((m=s.match(/(?:start|set)(?: a)? (\d+(?:\.\d+)?) (?:minute|min) timer/))){voiceStartTimer_(m[1]);return}if(/what(?:'s| is) for dinner/.test(s)){speak_(voiceDinner_());return}if(/calendar today|schedule today|what do we have today/.test(s)){speak_(voiceEvents_(new Date()));return}if(/what(?:'s| is) tomorrow|schedule tomorrow/.test(s)){let d=new Date();d.setDate(d.getDate()+1);speak_(voiceEvents_(d));return}if((m=s.match(/add (.+?) to (?:the )?(?:grocery|groceries|grocery list)$/))){voiceAddGroceries_(m[1]);return}if(/open (?:the )?grocer/.test(s)){openGroceries();speak_("Opening groceries.");return}if(/open (?:the )?recipe/.test(s)){openRecipes();speak_("Opening recipes.");return}if(/go home|open (?:the )?dashboard/.test(s)){document.querySelectorAll("#dayOverlay,#groceryOverlay,#recipeOverlay,#cookOverlay").forEach(x=>x.classList.remove("open"));updateCookMiniBar_();speak_("Back to the dashboard.");return}if(cookRecipe){if(/^(next|next step|continue)$/.test(s)){if(cookStep<cookRecipe.steps.length-1)cookNextStep();speak_(cookRecipe.steps[cookStep]);return}if(/previous|go back a step/.test(s)){cookPrevStep();speak_(cookRecipe.steps[cookStep]);return}if(/repeat|read this step|read the step/.test(s)){speak_(cookRecipe.steps[cookStep]);return}if(/read (?:the )?ingredients/.test(s)){speak_(cookRecipe.ingredients.join(". "));return}if((m=s.match(/how much (.+)$/))){let x=cookRecipe.ingredients.filter(i=>i.toLowerCase().includes(m[1])).slice(0,3);speak_(x.length?x.join(". "):`I couldn't find ${m[1]} in this recipe.`);return}if(/start (?:the )?timer/.test(s)){let x=cookTimerMatches_(cookRecipe.steps[cookStep]);if(x.length){startCookTimer(x[0].minutes);speak_(`${x[0].label} timer started.`)}else speak_("I don't see a timer in this step.");return}}speak_("I didn't recognize that command.")}

function cookLines_(text){return String(text||"").replace(/\r/g,"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\s*(?:step\s*)?\d+[.)\-:]?\s*/i,"").replace(/^[-•]\s*/,"").trim()).filter(Boolean)}
function cookSteps_(text){let raw=String(text||"").replace(/\r/g,"").trim();if(!raw)return ["No instructions were provided for this recipe."];let lines=cookLines_(raw);if(lines.length>1)return lines;let parts=raw.split(/(?<=[.!?])\s+(?=(?:Then|Next|Meanwhile|After|Add|Place|Cook|Bake|Roast|Grill|Smoke|Stir|Mix|Heat|Reduce|Remove|Serve|Let|Rest|Season|Pour|Transfer|Return|Cover|Uncover)\b)/i).map(x=>x.trim()).filter(Boolean);return parts.length?parts:[raw]}
function cookIngredients_(text){return String(text||"—").replace(/\r/g,"").split(/(?:\n+|;\s*)/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[-•]\s*/,"").trim()).filter(Boolean)}
function cookNum_(v){v=String(v||"").trim().replace("½",".5").replace("¼",".25").replace("¾",".75");if(/^\d+\s+\d+\/\d+$/.test(v)){let a=v.split(/\s+/),f=a[1].split("/");return Number(a[0])+Number(f[0])/Number(f[1])}if(/^\d+\/\d+$/.test(v)){let f=v.split("/");return Number(f[0])/Number(f[1])}return Number(v)}
function cookTimerMatches_(text){let out=[],re=/\b(?:about\s+|approximately\s+|approx\.?\s+)?(\d+(?:\.\d+)?|\d+\s+\d+\/\d+|\d+\/\d+|\d*\s*[½¼¾])(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?|\d+\s+\d+\/\d+|\d+\/\d+|\d*\s*[½¼¾]))?\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)\b/gi,m;while((m=re.exec(String(text||"")))){let a=cookNum_(m[1]),b=m[2]?cookNum_(m[2]):null,n=b||a,u=m[3].toLowerCase(),mins=u.startsWith("h")?n*60:u.startsWith("s")?n/60:n;if(mins>=.25&&mins<=720&&!out.some(x=>Math.abs(x.minutes-mins)<.001))out.push({minutes:mins,label:m[0].trim()})}return out.slice(0,4)}

function updateCookMiniBar_(){let bar=document.getElementById("cookMiniBar");if(!bar)return;if(!cookRecipe||document.getElementById("cookOverlay").classList.contains("open")){bar.classList.remove("open");return}let n=Math.max(1,cookRecipe.steps?.length||1),active=kitchenTimers.filter(x=>x.end>Date.now()).sort((a,b)=>a.end-b.end)[0];document.getElementById("cookMiniName").textContent="👨‍🍳 "+cookRecipe.name;document.getElementById("cookMiniMeta").textContent=`Step ${cookStep+1}/${n}${active?" • ⏱ "+fmtTimer(active.end-Date.now()):""}`;bar.classList.add("open")}

function renderCookMode(){if(!cookRecipe)return;let steps=cookRecipe.steps||[],n=Math.max(1,steps.length);cookStep=Math.max(0,Math.min(cookStep,n-1));document.getElementById("cookRecipeTitle").textContent="👨‍🍳 "+cookRecipe.name;document.getElementById("cookRecipeMeta").textContent=cookRecipe.meta||"Cook Mode";document.getElementById("cookScaleBar").innerHTML=cookScaleBarHtml_();document.getElementById("cookIngredients").innerHTML=(cookRecipe.ingredients||[]).map((x,i)=>`<label class="cookIngredient ${cookCheckedIngredients.has(i)?"checked":""}"><input type="checkbox" ${cookCheckedIngredients.has(i)?"checked":""} onchange="toggleCookIngredient(${i},this.checked)"><span>${esc(x)}</span></label>`).join("")||'<div class="empty">No ingredient list provided.</div>';document.getElementById("cookStepCount").textContent=`Step ${cookStep+1} of ${n}`;document.getElementById("cookProgressBar").style.width=((cookStep+1)/n*100)+"%";document.getElementById("cookStepText").textContent=steps[cookStep]||"—";let timers=cookTimerMatches_(steps[cookStep]||"");document.getElementById("cookDetectedTimers").innerHTML=timers.map(t=>`<button class="btn" onclick="startCookTimer(${t.minutes})">⏱️ Start ${esc(t.label)} Timer</button>`).join("");document.getElementById("cookPrevBtn").disabled=cookStep<=0;let next=document.getElementById("cookNextBtn");next.disabled=cookStep>=n-1;next.textContent=cookStep>=n-1?"✓ Last Step":"Next →";document.getElementById("cookAllStepsBtn").textContent=cookAllStepsOpen?"▣ One Step":"☷ All Steps";document.getElementById("cookSingleStep").classList.toggle("hidden",cookAllStepsOpen);let all=document.getElementById("cookAllSteps");all.classList.toggle("open",cookAllStepsOpen);all.innerHTML=steps.map((x,i)=>`<div class="cookAllStep ${i===cookStep?"current":""} ${cookCompletedSteps.has(i)?"done":""}" onclick="cookJumpStep(${i})"><b>${i+1}.</b>${esc(x)}${cookCompletedSteps.has(i)?'<span class="cookDoneBadge">✓</span>':""}</div>`).join("");updateCookTimerBar();updateCoo function likelyDinner_(r){let c=String(r.category||"").toLowerCase(),t=String(r.tags||"").toLowerCase();if(/breakfast|side|sauce|injection|finisher|topping/.test(c)&&!/(main)/.test(c))return false;if(/appetizer/.test(c)&&!/(main)/.test(c))return false;return /main|bbq|seafood|entree|dinner/.test(c)||/(chicken|beef|pork|turkey|seafood|shrimp|scallop|lasagna|skillet)/.test(t)}
function dinnerProtein_(r){let s=(String(r.tags||"")+" "+String(r.name||"")).toLowerCase();for(let k of ["chicken","beef","pork","turkey","shrimp","scallop","seafood","fish","sausage","vegetarian"]){if(s.includes(k))return k}return "other"}
function dinnerPool_(cat){let a=(R.recipes||[]).filter(likelyDinner_);if(cat)a=a.filter(x=>x.category===cat);return a}
function renderBuildWeek(){let b=document.getElementById("recipeBody"),today=new Date(),iso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0"),cats=[...new Set((R.recipes||[]).filter(likelyDinner_).map(x=>x.category).filter(Boolean))].sort();b.innerHTML=`<div class="buildPanel"><h2 style="margin-top:0">🎲 Build My Week — Dinner Only</h2><div class="rMeta" style="margin-bottom:10px">Pick seven dinners from Family Recipes Mission Control. It tries to avoid repeat proteins and can avoid dinners used recently.</div><div class="buildControls"><div><label>START DATE</label><input id="randomStartDate" type="date" value="${iso}"></div><div><label>RECIPE POOL</label><select id="randomCategory"><option value="">Likely dinner recipes</option>${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><label style="display:flex;align-items:center;gap:6px;margin:0;padding:10px"><input id="avoidRecent" type="checkbox" checked style="width:auto"> Avoid recent</label><button class="btn" onclick="generateDinnerWeek()">🎲 Pick 7 Dinners</button></div><div id="randomDinnerPreview"></div></div>`;if(randomDinnerDraft.length)renderDinnerPreview()}
function recentDinnerNames_(){let a=[];(S.mealPlanWeek||[]).forEach(x=>x.dinner&&a.push(x.dinner));(S.randomDinnerWeek||[]).forEach(x=>x.dinner&&a.push(x.dinner));return new Set(a)}
function smartDinnerPick_(pool,used,lastProtein,avoid){let candidates=pool.filter(x=>!used.has(x.id)&&(!avoid||!recentDinnerNames_().has(x.name)));if(!candidates.length)candidates=pool.filter(x=>!used.has(x.id));if(!candidates.length)candidates=pool.slice();let varied=candidates.filter(x=>dinnerProtein_(x)!==lastProtein);if(varied.length)candidates=varied;return candidates[Math.floor(Math.random()*candidates.length)]}
function generateDinnerWeek(){let iso=document.getElementById("randomStartDate").value,cat=document.getElementById("randomCategory").value,avoid=document.getElementById("avoidRecent").checked,pool=dinnerPool_(cat);if(!iso||!pool.length){alert("No dinner recipes match that selection yet.");return}let used=new Set(),last="";randomDinnerDraft=[];for(let i=0;i<7;i++){let x=smartDinnerPick_(pool,used,last,avoid);if(!x)break;used.add(x.id);last=dinnerProtein_(x);let dt=localDate_(iso,i);randomDinnerDraft.push({date:dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"),dinnerId:x.id,dinner:x.name,category:x.category,protein:last})}renderDinnerPreview()}
function renderDinnerPreview(){let e=document.getElementById("randomDinnerPreview");if(!e)return;e.innerHTML=`<div class="randomWeek">${randomDinnerDraft.map((d,i)=>`<div class="randomDinner"><h3>${localDate_(d.date,0).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})}</h3><div class="randomDinnerName" onclick="openRecipeDetail('${esc(d.dinnerId)}')" style="cursor:pointer">${esc(d.dinner)} <span class="tap">Recipe ›</span></div><div class="rMeta">${esc(d.category)}${d.protein&&d.protein!=="other"?` • ${esc(d.protein)}`:""}</div><button class="btn reroll" style="margin-top:8px" onclick="rerollDinner(${i})">🎲 Reroll Dinner</button></div>`).join("")}</div><button class="btn" onclick="loadDinnerWeek()">🍽️ Load These Dinners Into Menu</button><span class="rMeta" style="margin-left:8px">Only dinner is replaced in the weekly menu.</span>`}
function rerollDinner(i){let cat=document.getElementById("randomCategory")?.value||"",pool=dinnerPool_(cat),used=new Set(randomDinnerDraft.filter((_,j)=>j!==i).map(x=>x.dinnerId)),prev=i?randomDinnerDraft[i-1].protein:"",x=smartDinnerPick_(pool,used,prev,false);if(!x)return;randomDinnerDraft[i].dinnerId=x.id;randomDinnerDraft[i].dinner=x.name;randomDinnerDraft[i].category=x.category;randomDinnerDraft[i].protein=dinnerProtein_(x);renderDinnerPreview()}
function loadDinnerWeek(){if(!randomDinnerDraft.length)return;S.randomDinnerWeek=JSON.parse(JSON.stringify(randomDinnerDraft));S.mealPlanWeek=[];const keys=["SUN","MON","TUE","WED","THU","FRI","SAT"];randomDinnerDraft.forEach(d=>{let k=keys[localDate_(d.date,0).getDay()];S.menu[k]=`🌙 ${d.dinner}`});persist(()=>{renderDetail();renderCal();let e=document.getElementById("randomDinnerPreview");if(e)e.insertAdjacentHTML("afterbegin",'<div class="loadedBadge">✓ Seven dinners loaded into Weekly Menu &nbsp; <button class="btn" onclick="showGroceryGenTab()">🛒 Build Grocery List</button></div>')})}

function sendRecipeGroceries(){let items=RG.items.map((x,i)=>({selected:document.getElementById("rgCheck"+i)?.checked,name:(document.getElementById("rgName"+i)?.value||"").trim(),qty:(document.getElementById("rgQty"+i)?.value||"").trim(),category:document.getElementById("rgCat"+i)?.value||"Other",sourceText:RG.recipe||"Recipe"})).filter(x=>x.selected&&x.name);if(!items.length){alert("Nothing is selected to add.");return}let btn=document.getElementById("rgSendBtn"),st=document.getElementById("rgSendStatus");btn.disabled=true;btn.textContent="Adding…";st.textContent=`Sending ${items.length} item${items.length===1?"":"s"} to shared groceries…`;google.script.run.withSuccessHandler(g=>{G=g;btn.disabled=false;btn.textContent="✓ Added to Groceries";st.innerHTML=`${items.length} selected item${items.length===1?"":"s"} processed. Matching groceries were merged. <button class="btn" onclick="closeRecipes();openGroceries()">Open Groceries →</button>`}).withFailureHandler(e=>{btn.disabled=false;btn.textContent="🛒 Add Selected to Shared Groceries";st.textContent="Error: "+(e.message||e)}).addGeneratedGroceries(items)}
