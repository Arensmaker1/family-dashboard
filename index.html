<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   V8.16.3 GITHUB PAGES -> AUTHENTICATED APPS SCRIPT BRIDGE
   Fix: Apps Script HTML Service can place user HTML inside an
   additional Google-owned iframe. We remember the actual window
   that announces itself as the bridge and reply directly to it.
   ============================================================ */
const FAMILY_DASHBOARD_APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyg7NHXQNPKpZL6Ys4ZVZvrMCbhMsa41QbX6qxOQwWWO_iNhhx2QIzpPiveN4RCGPbKxQ/exec";
const FAMILY_DASHBOARD_GOOGLE_CLIENT_ID = "506798395973-q1umcrb418h5hv6i0fssguc1ftnk746h.apps.googleusercontent.com";
let familyDashboardIdToken = "";
let familyDashboardTokenTimer = null;
let familyDashboardExpiryTimer = null;
let familyDashboardAuthExpired_ = false;

(function installAppsScriptBridge_(){
  const pending = new Map();
  const queued = [];
  let bridgeReady = false;
  let bridgePeer = null;
  let seq = 0;

  const bridge = document.createElement("iframe");
  bridge.id = "appsScriptBridge";
  bridge.setAttribute("aria-hidden", "true");
  bridge.style.cssText =
    "position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0;pointer-events:none;";

  function bridgeUrl_(){
    const join = FAMILY_DASHBOARD_APPS_SCRIPT_URL.includes("?") ? "&" : "?";
    return FAMILY_DASHBOARD_APPS_SCRIPT_URL + join + "bridge=1";
  }

  function isGoogleBridgeOrigin_(origin){
    try{
      const u = new URL(origin);
      return u.protocol === "https:" &&
        (u.hostname === "script.google.com" ||
         u.hostname.endsWith(".googleusercontent.com") ||
         u.hostname === "googleusercontent.com");
    }catch(e){
      return false;
    }
  }

  function post_(payload){
  if(!bridgePeer) throw new Error("Family Dashboard backend bridge is not ready.");

  payload = Object.assign({}, payload, {
    idToken: familyDashboardIdToken
  });

  bridgePeer.postMessage(payload, "*");
}

  function flush_(){
    while(bridgeReady && bridgePeer && familyDashboardIdToken && queued.length){
      post_(queued.shift());
    }
  }

  function removeQueuedById_(id){
    const i=queued.findIndex(x=>x&&x.id===id);
    if(i>=0)queued.splice(i,1);
  }

  function failExpiredQueue_(){
    while(queued.length){
      const payload=queued.shift();
      const job=pending.get(payload.id);
      if(!job)continue;
      pending.delete(payload.id);
      clearTimeout(job.timer);
      const err=new Error("Family Dashboard sign-in expired before "+payload.method+" could run.");
      try{
        if(job.failure)job.failure(err);
        else console.error(err);
      }catch(e){console.error(e)}
    }
  }

  window.addEventListener("message", function(event){
    const msg = event.data || {};
    if(msg.type !== "fd-bridge-ready" && msg.type !== "fd-api-result") return;
    if(!isGoogleBridgeOrigin_(event.origin)) return;

    if(msg.type === "fd-bridge-ready"){
      bridgePeer = event.source;
      bridgeReady = true;
      console.log("Family Dashboard backend bridge ready:", event.origin);
      flush_();
      return;
    }

    if(!msg.id) return;
    const job = pending.get(msg.id);
    if(!job) return;
    pending.delete(msg.id);
    clearTimeout(job.timer);

    if(msg.ok){
      try{ job.success && job.success(msg.result); }catch(err){ console.error(err); }
    }else{
      const err = new Error(msg.error?.message || "Apps Script backend error");
      err.name = msg.error?.name || "Error";
      try{
        if(job.failure) job.failure(err);
        else console.error("Family Dashboard backend error:", err);
      }catch(handlerErr){
        console.error(handlerErr);
      }
    }
  });


  window.__fdBridgeDiag = function(){
    return {pending:pending.size, queued:queued.length, ready:!!bridgeReady};
  };

  function callBackend_(method, args, success, failure){
    const id = "fd-" + Date.now() + "-" + (++seq);
    const payload = {type:"fd-api-call", id, method, args:Array.from(args || []), idToken:familyDashboardIdToken};

    const timeoutMs = method==="addMealPlanSource" ? 30000 : 45000;
    const timer = setTimeout(function(){
      pending.delete(id);
      removeQueuedById_(id);
      const err = new Error("Family Dashboard backend timed out while calling " + method + ".");
      try{
        if(failure) failure(err);
        else console.error(err);
      }catch(e){console.error(e)}
    }, timeoutMs);

    pending.set(id, {success, failure, timer});

    if(familyDashboardAuthExpired_ && !familyDashboardIdToken){
      pending.delete(id);
      clearTimeout(timer);
      const err=new Error("Google session needs to be reconnected.");
      showAuthBanner_("Google session paused — reconnect to refresh dashboard data.","Reconnect");
      try{
        if(failure)failure(err);
        else console.warn(err.message);
      }catch(e){console.error(e)}
      return;
    }

    if(bridgeReady && bridgePeer && familyDashboardIdToken){
      post_(payload);
    }else{
      if(queued.length>=12){
        const oldest=queued.shift();
        const oldJob=oldest&&pending.get(oldest.id);
        if(oldJob){
          pending.delete(oldest.id);
          clearTimeout(oldJob.timer);
          try{oldJob.failure&&oldJob.failure(new Error("Family Dashboard backend queue was reset."));}catch(e){console.error(e)}
        }
      }
      queued.push(payload);
    }
  }

  function makeRunner_(){
    let success = null;
    let failure = null;
    let proxy;

    proxy = new Proxy({}, {
      get(_target, prop){
        if(prop === "withSuccessHandler"){
          return function(fn){ success = fn; return proxy; };
        }
        if(prop === "withFailureHandler"){
          return function(fn){ failure = fn; return proxy; };
        }
        if(prop === "withUserObject"){
          return function(){ return proxy; };
        }
        if(typeof prop === "symbol") return undefined;

        return function(...args){
          callBackend_(String(prop), args, success, failure);
        };
      }
    });

    return proxy;
  }

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  Object.defineProperty(window.google.script, "run", {
    configurable: true,
    get: makeRunner_
  });


  function decodeJwtPayload_(token){
    try{
      const part=String(token||"").split(".")[1]||"";
      const b64=part.replace(/-/g,"+").replace(/_/g,"/");
      return JSON.parse(decodeURIComponent(atob(b64).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join("")));
    }catch(e){return {}}
  }


  function ensureAuthBanner_(){
    let bar=document.getElementById("fdAuthBanner");
    if(bar)return bar;
    bar=document.createElement("div");
    bar.id="fdAuthBanner";
    bar.style.cssText="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9998;display:none;align-items:center;gap:10px;max-width:min(720px,92vw);padding:9px 12px;border:1px solid #495c70;border-radius:12px;background:#0d1822;color:#f4f6f8;box-shadow:0 5px 18px rgba(0,0,0,.25);font:600 12px Arial,sans-serif";
    bar.innerHTML='<span id="fdAuthBannerText">Google session needs attention.</span><button id="fdAuthBannerBtn" type="button" style="margin-left:auto;border:1px solid #66798c;border-radius:9px;background:#132435;color:#f4f6f8;padding:7px 10px;font-weight:700;cursor:pointer">Reconnect</button>';
    document.body.appendChild(bar);
    document.getElementById("fdAuthBannerBtn").addEventListener("click",requestGoogleSessionRefresh_);
    return bar;
  }

  function showAuthBanner_(message,buttonText){
    const bar=ensureAuthBanner_();
    const msg=document.getElementById("fdAuthBannerText");
    const btn=document.getElementById("fdAuthBannerBtn");
    if(msg)msg.textContent=message||"Google session needs attention.";
    if(btn)btn.textContent=buttonText||"Reconnect";
    bar.style.display="flex";
  }

  function hideAuthBanner_(){
    const bar=document.getElementById("fdAuthBanner");
    if(bar)bar.style.display="none";
  }

  function requestGoogleSessionRefresh_(){
    if(!window.google?.accounts?.id){
      showAuthBanner_("Google sign-in is still loading. Try again in a moment.","Reconnect");
      return;
    }
    try{
      google.accounts.id.prompt(function(notification){
        // If the browser cannot refresh with One Tap, expose the normal
        // Google button without covering the entire dashboard.
        if(notification && (notification.isNotDisplayed?.() || notification.isSkippedMoment?.())){
          showAuthGate_("Google needs a quick confirmation to keep the dashboard connected.");
        }
      });
    }catch(e){
      showAuthGate_("Google needs a quick confirmation to keep the dashboard connected.");
    }
  }

  function expireFamilyDashboardSession_(){
    const livePayload=decodeJwtPayload_(familyDashboardIdToken);
    const liveExp=Number(livePayload.exp||0)*1000;
    if(liveExp>Date.now()+5000)return;
    familyDashboardAuthExpired_=true;
    familyDashboardIdToken="";
    failExpiredQueue_();
    showAuthBanner_("Google session paused — reconnect to refresh calendars, chores, recipes, and groceries.","Reconnect");
  }

  function showAuthGate_(message){
    let gate=document.getElementById("fdAuthGate");
    if(!gate){
      gate=document.createElement("div");
      gate.id="fdAuthGate";
      gate.style.cssText="position:fixed;inset:0;z-index:9999;background:#071018;display:grid;place-items:center;font-family:Arial,sans-serif;color:#f4f6f8";
      gate.innerHTML='<div style="width:min(420px,90vw);text-align:center;padding:28px;border:1px solid #314152;border-radius:16px;background:#0d1822"><div style="font-size:30px;font-weight:800;margin-bottom:8px">🏠 Family Dashboard</div><div id="fdAuthMessage" style="color:#98a6b4;margin-bottom:18px">Sign in with an authorized family Google account.</div><div id="fdGoogleSignIn" style="display:flex;justify-content:center"></div></div>';
      document.body.appendChild(gate);
    }
    const m=document.getElementById("fdAuthMessage");
    if(m && message) m.textContent=message;
    gate.style.display="grid";
  }

  function hideAuthGate_(){
    const gate=document.getElementById("fdAuthGate");
    if(gate) gate.style.display="none";
  }

  function handleGoogleCredential_(response){
    const token=String(response?.credential||"");
    if(!token){showAuthGate_("Google sign-in did not return a credential.");return}
    familyDashboardIdToken=token;
    familyDashboardAuthExpired_=false;
    hideAuthGate_();
    hideAuthBanner_();
    flush_();

    clearTimeout(familyDashboardTokenTimer);
    clearTimeout(familyDashboardExpiryTimer);

    const payload=decodeJwtPayload_(token);
    const expiresAt=Number(payload.exp||0)*1000;
    if(!expiresAt)return;

    // Five minutes before expiry, show a small intentional reminder instead
    // of suddenly throwing Google's account chooser over the dashboard.
    const warningIn=Math.max(1000,expiresAt-Date.now()-5*60000);
    familyDashboardTokenTimer=setTimeout(function(){
      const livePayload=decodeJwtPayload_(familyDashboardIdToken);
      const liveExp=Number(livePayload.exp||0)*1000;
      if(liveExp!==expiresAt && liveExp>Date.now()+5*60000)return;
      showAuthBanner_("Google session refresh due soon. Tap Refresh whenever convenient.","Refresh Google");
    },warningIn);

    // At actual expiry keep the dashboard visible, pause backend work, and
    // request reconnection without building up bridge calls in the background.
    familyDashboardExpiryTimer=setTimeout(expireFamilyDashboardSession_,Math.max(1000,expiresAt-Date.now()+1000));
  }

  function startGoogleSignIn_(){
    if(!FAMILY_DASHBOARD_GOOGLE_CLIENT_ID || FAMILY_DASHBOARD_GOOGLE_CLIENT_ID.includes("PASTE_YOUR")){
      showAuthGate_("Dashboard sign-in is not configured yet.");
      return;
    }
    if(!window.google?.accounts?.id){
      setTimeout(startGoogleSignIn_,150);
      return;
    }
    showAuthGate_("Sign in with an authorized family Google account.");
    google.accounts.id.initialize({
      client_id:FAMILY_DASHBOARD_GOOGLE_CLIENT_ID,
      callback:handleGoogleCredential_,
      auto_select:true,
      cancel_on_tap_outside:false
    });
    const target=document.getElementById("fdGoogleSignIn");
    if(target){
      google.accounts.id.renderButton(target,{theme:"outline",size:"large",shape:"pill",text:"signin_with"});
    }
    google.accounts.id.prompt();
  }

  function mountBridge_(){
    bridge.src = bridgeUrl_();
    document.body.appendChild(bridge);
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", function(){ mountBridge_(); startGoogleSignIn_(); }, {once:true});
  }else{
    mountBridge_();
    startGoogleSignIn_();
  }
})();
</script>

function fdDiagStore_(sample){
 try{
  let a=JSON.parse(localStorage.getItem("familyDashboardRendererDiagV1")||"[]");
  if(!Array.isArray(a))a=[];
  a.push(sample);
  a=a.slice(-90);
  localStorage.setItem("familyDashboardRendererDiagV1",JSON.stringify(a));
 }catch(_){}
}
function fdDiagSamples_(){
 try{let a=JSON.parse(localStorage.getItem("familyDashboardRendererDiagV1")||"[]");return Array.isArray(a)?a:[]}catch(_){return[]}
}
function fdDiagHeapMb_(){
 try{return performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576):null}catch(_){return null}
}
function fdDiagSample_(){
 let bridge={pending:null,queued:null,ready:null};
 try{if(typeof window.__fdBridgeDiag==="function")bridge=window.__fdBridgeDiag()||bridge}catch(_){}
 let s={
  ts:Date.now(),
  nodes:document.getElementsByTagName("*").length,
  heap:fdDiagHeapMb_(),
  longTasks:fdDiagLongTasks_,
  longest:Math.round(fdDiagLongestTask_),
  lag:Math.round(fdDiagHeartbeatLag_),
  bridgePending:bridge.pending,
  bridgeQueued:bridge.queued,
  core:!!coreLoadInFlight_,
  weather:!!weatherLoadInFlight_,
  pantry:!!pantryLoadInFlight_,
  groceries:!!groceryLoadInFlight_,
  voice:!!voiceWanted,
  recognition:!!voiceRecognition,
  authExpired:!!familyDashboardAuthExpired_,
  timers:Array.isArray(kitchenTimers)?kitchenTimers.length:0,
  modal:!!modalOrOverlayOpen_()
 };
 fdDiagStore_(s);
 return s;
}
function startRendererDiagnostics_(){
 document.body.classList.add("fdRendererSafe");
 try{
  if("PerformanceObserver" in window){
   let po=new PerformanceObserver(list=>{
    list.getEntries().forEach(e=>{
      fdDiagLongTasks_++;
      fdDiagLongestTask_=Math.max(fdDiagLongestTask_,Number(e.duration)||0);
    });
   });
   po.observe({entryTypes:["longtask"]});
  }
 }catch(_){}
 clearInterval(fdDiagHeartbeatTimer_);
 fdDiagHeartbeatTimer_=setInterval(()=>{
  let now=Date.now(),expected=fdDiagLastHeartbeat_+5000;
  fdDiagHeartbeatLag_=Math.max(0,now-expected);
  fdDiagLastHeartbeat_=now;
 },5000);
 clearInterval(fdDiagSampler_);
 fdDiagSampler_=setInterval(()=>{if(dashboardVisible_())fdDiagSample_()},60000);
 setTimeout(fdDiagSample_,12000);
}
function rendererDiagSummary_(){
 let a=fdDiagSamples_(),last=a[a.length-1]||fdDiagSample_(),first=a[0]||last;
 let heapDelta=(last.heap!=null&&first.heap!=null)?last.heap-first.heap:null;
 let nodeDelta=(last.nodes||0)-(first.nodes||0);
 return {a,last,first,heapDelta,nodeDelta};
}
function clearRendererDiagnostics_(){
 try{localStorage.removeItem("familyDashboardRendererDiagV1")}catch(_){}
 fdDiagLongTasks_=0;fdDiagLongestTask_=0;fdDiagHeartbeatLag_=0;fdDiagLastHeartbeat_=Date.now();
 openRendererDiagnostics_();
}
function toggleRendererSafe_(){

   <div><b>${last.heap==null?"—":last.heap+" MB"}</b><span>JS heap</span></div>
   <div><b>${last.longTasks??0}</b><span>long tasks</span></div>
   <div><b>${last.lag??0} ms</b><span>heartbeat lag</span></div>
   <div><b>${last.bridgePending??"—"}</b><span>bridge pending</span></div>
   <div><b>${last.bridgeQueued??"—"}</b><span>bridge queued</span></div>
   <div><b>${x.nodeDelta>=0?"+":""}${x.nodeDelta}</b><span>node change</span></div>
   <div><b>${x.heapDelta==null?"—":(x.heapDelta>=0?"+":"")+x.heapDelta+" MB"}</b><span>heap change</span></div>
  </div>
  <div class="actions" style="justify-content:flex-start">
   <button class="btn" onclick="toggleRendererSafe_()">${document.body.classList.contains("fdRendererSafe")?"✓ Safe Motion ON":"Safe Motion OFF"}</button>
   <button class="btn" onclick="fdDiagSample_();openRendererDiagnostics_()">Sample Now</button>
   <button class="btn" onclick="clearRendererDiagnostics_()">Clear Log</button>
   <button class="btn" onclick="closeModal()">Close</button>
  </div>
  <div class="fdDiagLog">
   ${rows.length?rows.map(s=>`<div class="fdDiagRow"><span>${new Date(s.ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"})}</span><span>${s.nodes} nodes</span><span>${s.heap==null?"—":s.heap+"MB"}</span><span>${s.lag||0}ms lag</span><span>${s.voice?"voice • ":""}${s.recognition?"mic • ":""}${s.authExpired?"auth paused • ":""}${s.bridgePending?`${s.bridgePending} bridge pending • `:""}${s.core||s.weather||s.pantry||s.groceries?"request active":""}</span></div>`).join(""):`<div class="empty">No samples yet.</div>`}
  </div>
 </div>`);
}

function calendarEventKind_(title){
 let t=String(title||"").toLowerCase();
 if(/\b(birthday|bday)\b/.test(t))return"birthday";
 if(/\b(vacation|trip|cruise|flight|travel)\b/.test(t))return"vacation";

   if(S.hiddenCalendars.includes(e.calendar))return;
   let kind=calendarEventKind_(e.title);if(!kind)return;
   let d=new Date(e.start);d.setHours(0,0,0,0);let days=Math.round((d-n)/86400000);
   let horizon=kind==="birthday"?14:(kind==="vacation"||kind==="school"?14:7);
   if(days>=0&&days<=horizon)a.push({t:e.title,d:days,k:kind});
 });
 a.sort((x,y)=>x.d-y.d||x.t.localeCompare(y.t));
 let seen=new Set();a=a.filter(x=>{let k=x.t.toLowerCase()+"|"+x.d;if(seen.has(k))return false;seen.add(k);return true});

function celebrateDaily(who){let msgs=[`Nice work, ${who}!`,`Chores crushed, ${who}!`,`Mission accomplished, ${who}!`,`Great job, ${who}!`],icons=["🎉","🚀","🏆","⭐"];let n=Math.floor(Math.random()*msgs.length),wrap=document.createElement("div");wrap.className="dailyCelebrate";wrap.innerHTML=`<div class="dailyCelebrateBox"><div class="dailyCelebrateIcon">${icons[n]}</div><div class="dailyCelebrateText">${esc(msgs[n])}</div><div class="dailyCelebrateSub">All of today's chores are done!</div></div>`;document.body.appendChild(wrap);miniConfetti();playCelebrationSound(false);setTimeout(()=>wrap.remove(),3400)}
function celebrateFiveDay(who){showBanner(`🔥 ${who}: 5-DAY CHORE STREAK!`,3000);launchConfetti("🏆");playCelebrationSound(true);setTimeout(()=>showBanner("🎁 SEE DAD FOR YOUR PRIZE!",4200),2700)}
function checkChoreCelebrations(who){if(!personChoresComplete(sel,who))return;S.dailyCelebrations=S.dailyCelebrations||{};S.streakRewards=S.streakRewards||{};let dayMark=key(sel)+"|"+who,streak=personChoreStreak(who,sel);if(streak===5&&!S.streakRewards[dayMark]){S.streakRewards[dayMark]=true;S.dailyCelebrations[dayMark]=true;celebrateFiveDay(who);return}if(!S.dailyCelebrations[dayMark]){S.dailyCelebrations[dayMark]=true;celebrateDaily(who)}}
function maybeCelebrateStreak(){let people=[...new Set(choresFor(sel).map(x=>x.who||"Kid"))];people.forEach(checkChoreCelebrations)}

function dinnerForDate_(d){
 let iso=key(d),x=(S.mealPlanWeek||[]).find(v=>v.date===iso);
 if(x&&x.dinner)return {name:x.dinner,id:x.dinnerId||"",source:"plan",planName:x.planName||"Meal Plan"};
 x=(S.randomDinnerWeek||[]).find(v=>v.date===iso);
 if(x&&x.dinner)return {name:x.dinner,id:x.id||x.dinnerId||"",source:"library",planName:"Build My Week"};
 let keys=["SUN","MON","TUE","WED","THU","FRI","SAT"],raw=String(S.menu?.[keys[d.getDay()]]||"").trim();
 if(!raw)return null;
 let m=raw.match(/(?:🌙\s*)?([^•]+)$/),name=(m?m[1]:raw).replace(/^🌙\s*/,"").trim();
 return name?{name:name,id:"",source:"",planName:"Weekly Menu"}:null;
}
function normalizeDinnerRecipeName_(v){
 return String(v||"")
  .toLowerCase()
  .replace(/\([^)]*\)/g," ")
  .replace(/&/g," and ")
  .replace(/[^\w\s]/g," ")
  .replace(/\b(?:the|recipe|family|style|version|dinner|meal)\b/g," ")
  .replace(/\s+/g," ")
  .trim();
}
function dinnerRecipeTokens_(v){
 const stop=new Set(["with","and","for","from","into","style","recipe","family","dinner","meal","easy","best"]);
 return normalizeDinnerRecipeName_(v).split(" ").filter(x=>x.length>2&&!stop.has(x));
}
function recipeMatchForDinner_(dinner){
 if(!dinner)return null;
 if(dinner.id){
  let pool=dinner.source==="plan"?(MP.recipes||[]):(R.recipes||[]),
      x=pool.find(r=>String(r.id)===String(dinner.id));
  if(x)return {source:dinner.source,id:x.id,recipe:x,match:"id"};
 }

 let dn=normalizeDinnerRecipeName_(dinner.name);
 if(!dn)return null;

 for(let source of ["library","plan"]){
  let pool=source==="library"?(R.recipes||[]):(MP.recipes||[]);
  let x=pool.find(r=>normalizeDinnerRecipeName_(r.name)===dn);
  if(x)return {source,id:x.id,recipe:x,match:"exact"};
 }

 if(dn.length>=5){
  for(let source of ["library","plan"]){
   let pool=source==="library"?(R.recipes||[]):(MP.recipes||[]);
   let hits=pool.filter(r=>{
    let rn=normalizeDinnerRecipeName_(r.name);
    return rn&&rn.length>=5&&(rn.includes(dn)||dn.includes(rn));
   });
   if(hits.length===1)return {source,id:hits[0].id,recipe:hits[0],match:"title"};
  }
 }

 let dt=dinnerRecipeTokens_(dinner.name),best=null,second=0;
 if(dt.length){
  for(let source of ["library","plan"]){
   let pool=source==="library"?(R.recipes||[]):(MP.recipes||[]);
   pool.forEach(r=>{
    let rt=dinnerRecipeTokens_(r.name);
    if(!rt.length)return;
    let shared=dt.filter(t=>rt.includes(t)).length;
    let score=shared/Math.max(dt.length,Math.min(rt.length,3));
    if(shared>=1&&score>0){
      if(!best||score>best.score){second=best?best.score:second;best={source,id:r.id,recipe:r,score}}
      else if(score>second)second=score;
    }
   });
  }
 }
 if(best&&best.score>=.67&&(best.score-second)>=.15)return {...best,match:"fuzzy"};
 return null;
}
function groceryNeedForRecipe_(recipe){

 let parts=cookIngredients_(recipe.ingredients||"").map(x=>x.toLowerCase()),active=G.items.filter(x=>!x.checked);
 let missing=0;
 parts.forEach(line=>{let words=line.replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!/^(cup|cups|tbsp|tsp|tablespoon|teaspoon|ounce|ounces|pound|pounds|clove|cloves|large|small|medium|fresh|minced|chopped|diced|sliced|ground|optional|taste)$/.test(w));if(words.length&&!active.some(g=>{let gn=String(g.name||"").toLowerCase();return words.slice(-2).some(w=>gn.includes(w))}))missing++});
 return {missing,total:parts.length};
}

function durationMinutesFromText_(text){
 let s=String(text||"").toLowerCase(),total=0,found=[];
 let re=/\b(?:for\s+|about\s+|approximately\s+|approx\.?\s+|roughly\s+|around\s+)?(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min)\b/g,m;
 while((m=re.exec(s))){let n=Number(m[1]),mins=/^h/.test(m[2])?n*60:n;if(mins>0&&mins<=1440)found.push(mins)}
 if(!found.length)return null;
 // Recipe steps usually contain sequential durations; cap absurd totals.
 total=found.reduce((a,b)=>a+b,0);return Math.min(total,1440);
}

function prepIntelForRecipe_(recipe){
 let s=[recipe?.ingredients,recipe?.instructions,recipe?.notes].filter(Boolean).join(" ").toLowerCase(),hits=[];
 if(/\bovernight\b/.test(s))hits.push("overnight prep");
 if(/\b(?:marinate|marinade)\b/.test(s)){let m=s.match(/(?:marinate|marinade)[^.!;\n]{0,80}?(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min)/);hits.push(m?`marinate ${m[1]} ${m[2]}`:"marinate ahead")}
 if(/\bthaw|defrost\b/.test(s))hits.push("thaw ahead");
 if(/\bsoak\b/.test(s))hits.push("soak ahead");
 if(/\bbrine\b/.test(s))hits.push("brine ahead");
 if(/\brefrigerat(?:e|ed)[^.!;\n]{0,60}?\d+\s*(?:hours?|hrs?|hr|minutes?|mins?|min)/.test(s)){let m=s.match(/refrigerat(?:e|ed)[^.!;\n]{0,60}?(\d+(?:\.\d+)?)\s*(hours?|hrs?|hr|minutes?|mins?|min)/);if(m)hits.push(`chill ${m[1]} ${m[2]}`)}
 return [...new Set(hits)].slice(0,2);
}

function renderGlance(){
 let e=document.getElementById("glanceStrip");if(!e)return;
 let now=new Date(),tom=new Date(now);tom.setDate(now.getDate()+1);
 let E=futureEventsForDay_(now,true).slice(0,3),T=futureEventsForDay_(tom,false).slice(0,3),
 pins=(S.pinnedNotes||[]);
 let line=a=>a.length?a.map(x=>(x.allDay?"":time(x)+" ")+x.title).join(" • "):"Nothing else scheduled";
 let label=now.getHours()>=17?"TONIGHT":"TODAY",dinner=dinnerCommandHtml_(now),tomDinner=dinnerForDate_(tom);
 e.innerHTML=`${calendarIntelHtml_()}${dinner}<div class="glanceBox"><b>${label}</b><div class="glanceText">${esc(line(E))}</div></div><div class="glanceBox"><b>TOMORROW</b><div class="glanceText">${esc(line(T))}${tomDinner?` • 🍽️ ${esc(tomDinner.name)}`:""}</div></div>${pins.length?`<div class="glanceBox"><b>📌 IMPORTANT</b><div class="glanceText">${esc(pins[0])}${pins.length>1?` • +${pins.length-1} more`:""}</div></div>`:""}`;

/* V9.6.2 — Morning Brief section helpers */
function morningSummaryHtml_(){
 let now=new Date(),
     events=futureEventsForDay_(now,true),
     cs=morningChoreStats_(),
     rs=reminderStats2_(),
     parts=[];
 if(events.length)parts.push(`${events.length} thing${events.length===1?"":"s"} left on calendar`);
 if(cs.left)parts.push(`${cs.left} chore${cs.left===1?"":"s"} remaining`);
 if(rs.overdue)parts.push(`${rs.overdue} household job${rs.overdue===1?"":"s"} overdue`);
 if(!parts.length)parts.push("the household is looking pretty clear");
 let greeting=now.getHours()<12?"Good morning":now.getHours()<17?"Good afternoon":"Good evening";
 return `<div class="briefSummary"><div class="briefSummaryIcon">☀️</div><div><b>${greeting}.</b> ${esc(parts.join(" • "))}</div></div>`;
}
function tomorrowPreviewHtml_(){
 let d=new Date();d.setDate(d.getDate()+1);
 let events=futureEventsForDay_(d,false).sort((a,b)=>new Date(a.start)-new Date(b.start)),
     dinner=dinnerForDate_(d);
 if(!events.length&&!dinner)return `<div class="briefTomorrow"><b>UP FIRST TOMORROW</b><span>Nothing major on deck yet.</span></div>`;
 let bits=[];
 if(events.length){
  let e=events[0];
  bits.push(`${e.allDay?"All day":time(e)} • ${e.title}`);
 }
 if(dinner)bits.push(`🍽️ ${dinner.name}`);
 return `<div class="briefTomorrow"><b>UP FIRST TOMORROW</b>${bits.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
}
function morningChoreSummaryHtml_(){
 let d=new Date(),C=choresFor(d);
 if(!C.length)return `<div class="briefLine briefGood">✓ No chores assigned today.</div>`;
 let people={};
 C.forEach(x=>{
  let who=String(x.who||"Household").trim()||"Household",
      done=!!S.completions[key(d)+"-"+x.i];
  if(!people[who])people[who]={total:0,left:0};
  people[who].total++;
  if(!done)people[who].left++;
 });
 return Object.keys(people).sort((a,b)=>a.localeCompare(b)).map(who=>{
  let p=people[who];
  return `<div class="briefPersonRow"><b>${esc(who)}</b><span>${p.left===0?`all done ✓`:`${p.left} chore${p.left===1?"":"s"}`}</span></div>`;
 }).join("");
}
function morningGroceryHtml_(){
 if(!G||!Array.isArray(G.items))return `<div class="briefLine">Grocery list is still loading.</div>`;
 let active=G.items.filter(x=>!x.checked);
 return active.length
  ? `<div class="briefCountOnly"><b>${active.length}</b><span>grocery item${active.length===1?"":"s"} remaining</span></div>`
  : `<div class="briefLine briefGood">✓ Grocery list clear.</div>`;
}

function morningReminderHtml_(){
 let all=activeBriefReminders_(),due=all.filter(r=>daysUntil_(r.nextDue)<=7);
 if(!due.length)return `<div class="briefLine">✓ No household jobs due this week.</div>`;
 return due.slice(0,4).map(r=>{
  let cls=reminderClass_(r),n=daysUntil_(r.nextDue);
  return `<div class="hrBriefItem ${cls}">
   <div><b>${esc(r.name)}</b><div class="hrBriefDue">${esc(reminderDueText_(r))}${r.lastDone?` • Last done ${esc(dateOnly_(r.lastDone).toLocaleDateString([],{month:"short",day:"numeric"}))}`:""}</div></div>
   <div class="hrBriefBtns">
    <button class="btn mini" onclick="markHouseholdReminderDone_('${esc(r.id)}','brief')">✓ Done</button>
    ${n<=0?`<button class="btn mini" onclick="snoozeHouseholdReminder_('${esc(r.id)}',1,'brief')">+1d</button><button class="btn mini" onclick="snoozeHouseholdReminder_('${esc(r.id)}',7,'brief')">+7d</button>`:""}
   </div>
  </div>`;
 }).join("");
}
function upcomingHouseholdHtml_(){
 let a=activeBriefReminders_().filter(r=>{let n=daysUntil_(r.nextDue);return n>7&&n<=30}).slice(0,3);
 if(!a.length)return "";
 return `<div class="hrUpcoming"><b>COMING UP</b>${a.map(r=>`<span>${esc(r.name)} • ${esc(reminderDueText_(r))}</span>`).join("")}</div>`;
}
function morningPriorityHtml_(){
 let rs=reminderStats2_(),bits=[];
 if(rs.overdue)bits.push(`🔴 ${rs.overdue} household job${rs.overdue===1?" is":"s are"} overdue`);
 if(rs.today)bits.push(`🟠 ${rs.today} household job${rs.today===1?" is":"s are"} due today`);
 let dinner=morningDinnerData_();
 if(dinner?.prep?.length)bits.push(`🍽️ Dinner prep: ${dinner.prep[0]}`);
 if(dinner?.busy)bits.push(`📅 Busy evening: ${dinner.busy.count||1} event${(dinner.busy.count||1)===1?"":"s"}`);
 if(!bits.length)return `<div class="briefPriority"><h3>⭐ WHAT MATTERS</h3><div class="briefPriorityRow">Nothing urgent is fighting for your attention right now.</div></div>`;
 return `<div class="briefPriority"><h3>⭐ WHAT MATTERS</h3>${bits.slice(0,4).map(x=>`<div class="briefPriorityRow">${esc(x)}</div>`).join("")}</div>`;
}

 let priority=briefSafe_("What Matters",()=>morningPriorityHtml_(),`<div class="briefPriority"><h3>⭐ WHAT MATTERS</h3><div class="briefPriorityRow">Dashboard data is still loading.</div></div>`);

 let tomorrow=briefSafe_("Tomorrow",()=>tomorrowPreviewHtml_());
 let weather=briefSafe_("Weather",()=>morningWeatherHtml_());
 let sports=briefSafe_("Sports",()=>morningSportsHtml_());

 let chores=briefSafe_("Chores",()=>morningChoreSummaryHtml_());

function openMorningBrief(){
 try{if(!SPORTS||SPORTS.loading||!Array.isArray(SPORTS.teams)||!SPORTS.teams.length){loadSports(false)}}catch(e){console.warn("Brief sports kickoff failed",e)}
 try{
  let modal=document.getElementById("modal"),bg=document.getElementById("modalbg");
  if(modal&&!modal.querySelector(".briefWrap"))modal.innerHTML=`<div class="briefWrap"><h2 style="margin:0 0 10px">☀️ Morning Brief 2.0</h2><div class="briefLine">Loading today’s household rundown…</div></div>`;
  if(bg)bg.style.display="grid";
 }catch(_){}
 try{markMorningBriefSeen_()}catch(err){console.warn("Morning Brief seen marker failed",err)}
 try{ensureHouseholdReminders_()}catch(err){console.warn("Morning Brief reminders prep failed",err)}
 try{refreshMorningBrief_()}catch(err){console.error("Morning Brief initial render failed",err)}
 try{
  if(!SPORTS || SPORTS.loading || !Array.isArray(SPORTS.teams) || !SPORTS.teams.length){
   loadSports(false);
  }
 }catch(err){console.warn("Morning Brief sports refresh failed",err)}
 try{ensureDinnerData_(()=>{try{refreshMorningBrief_()}catch(_){}})}catch(err){console.warn("Morning Brief dinner refresh failed",err)}
 try{
  if(window.google&&google.script&&google.script.run){
   google.script.run
    .withSuccessHandler(g=>{try{G=g||{items:[]};refreshMorningBrief_()}catch(_){}})

 }catch(err){console.warn("Morning Brief grocery refresh setup failed",err)}

function captureHouseholdReminders_(){
 ensureHouseholdReminders_();
 return S.householdReminders.map((r,i)=>({
  id:r.id||("hr_"+Date.now()+"_"+i),
  name:(document.getElementById("hrName"+i)?.value||r.name||"").trim(),
  intervalDays:Math.max(1,Number(document.getElementById("hrDays"+i)?.value)||Number(r.intervalDays)||1),
  nextDue:document.getElementById("hrDue"+i)?.value||r.nextDue||key(new Date()),
  lastDone:r.lastDone||"",
  category:document.getElementById("hrCat"+i)?.value||r.category||"Home",
  notes:(document.getElementById("hrNotes"+i)?.value||r.notes||"").trim()
 })).filter(r=>r.name);
}
function addHouseholdReminder_(){
 try{S.householdReminders=captureHouseholdReminders_()}catch(_){ensureHouseholdReminders_()}
 S.householdReminders.push({id:"hr_"+Date.now(),name:"",intervalDays:90,nextDue:key(new Date()),lastDone:"",category:"Home",notes:""});
 openHouseholdReminders();
 setTimeout(()=>document.getElementById("hrName"+(S.householdReminders.length-1))?.focus(),40);
}
function deleteHouseholdReminder_(i){
 S.householdReminders=captureHouseholdReminders_();
 S.householdReminders.splice(i,1);
 openHouseholdReminders();
}
function saveHouseholdReminders_(){
 S.householdReminders=captureHouseholdReminders_();
 persist(()=>{openMorningBrief();renderGlance()});
}

function openGroceries(){document.getElementById("groceryOverlay").classList.add("open");let s=document.getElementById("groceryCategory");if(!s.innerHTML)s.innerHTML=groceryCategoryOptions();refreshGroceries();clearInterval(groceryTimer);groceryTimer=setInterval(refreshGroceries,20000);setTimeout(()=>document.getElementById("groceryName")?.focus(),100);activity()}
function closeGroceries(){document.getElementById("groceryOverlay").classList.remove("open");clearInterval(groceryTimer);groceryTimer=null;activity()}
function renderGroceries(){let body=document.getElementById("groceryBody");if(!body)return;let active=G.items.filter(x=>!x.checked).length,checked=G.items.length-active;document.getElementById("groceryCount").innerHTML=`${active} to get${checked?` • ${checked} checked`:""}<div class="gMergeNote">Recipe and weekly-plan adds automatically merge matching items.</div>`;document.getElementById("grocerySync").textContent=G.updatedAt?"Synced "+new Date(G.updatedAt).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";if(!G.items.length){body.innerHTML='<div class="gEmpty">Your list is empty. Add something delicious. 😈</div>';return}let html="";GROCERY_CATEGORIES.forEach(cat=>{let a=G.items.filter(x=>x.category===cat).sort((a,b)=>Number(a.checked)-Number(b.checked)||a.name.localeCompare(b.name));if(!a.length)return;html+=`<section class="gSection"><div class="gSectionTitle">${esc(cat)}</div>${a.map(x=>`<div class="gItem ${x.checked?"checked":""}"><input type="checkbox" ${x.checked?"checked":""} onchange="setGroceryCheckedUI('${x.id}',this.checked)"><span class="gName">${x.qty?`<span class="gQty">${esc(x.qty)}</span>`:""}${esc(x.name)}${x.source?`<span class="gSource">From: ${esc(x.source)}</span>`:""}</span><div class="gItemActions"><button class="gEdit" onclick="editGroceryUI('${x.id}')" title="Edit">✎</button><button class="gDelete" onclick="deleteGroceryUI('${x.id}')" title="Delete">×</button></div></div>`).join("")}</section>`});body.innerHTML=html}
function groceryFail(e){document.getElementById("grocerySync").textContent="Sync error";console.error(e)}
function refreshGroceries(){
 if(groceryLoadInFlight_)return;
 groceryLoadInFlight_=true;
 google.script.run
  .withSuccessHandler(g=>{groceryLoadInFlight_=false;G=g;renderGroceries()})
  .withFailureHandler(e=>{groceryLoadInFlight_=false;groceryFail(e)})

}
function addGrocery(){let i=document.getElementById("groceryName"),q=document.getElementById("groceryQty"),s=document.getElementById("groceryCategory"),name=i.value.trim(),qty=q.value.trim();if(!name)return;let guessed=guessGroceryCategory(name);if(!s.dataset.touched)s.value=guessed;i.value="";q.value="";google.script.run.withSuccessHandler(g=>{G=g;renderGroceries();s.dataset.touched="";i.focus()}).withFailureHandler(groceryFail).addGroceryItem(name,s.value,qty)}
function editGroceryUI(id){let x=G.items.find(i=>i.id===id);if(!x)return;let name=prompt("Item name:",x.name);if(name===null||!name.trim())return;let qty=prompt("Quantity / amount (optional):",x.qty||"");if(qty===null)return;let cats=GROCERY_CATEGORIES.map((c,i)=>`${i+1}. ${c}`).join("\n");let cat=prompt(`Category — type a name or number:\n${cats}`,x.category||guessGroceryCategory(name));if(cat===null)return;cat=cat.trim();let n=Number(cat);if(Number.isInteger(n)&&n>=1&&n<=GROCERY_CATEGORIES.length)cat=GROCERY_CATEGORIES[n-1];if(!GROCERY_CATEGORIES.includes(cat))cat=guessGroceryCategory(name);google.script.run.withSuccessHandler(g=>{G=g;renderGroceries()}).withFailureHandler(groceryFail).updateGroceryItem(id,name.trim(),cat,qty.trim())}
function setGroceryCheckedUI(id,v){google.script.run.withSuccessHandler(g=>{G=g;renderGroceries()}).withFailureHandler(groceryFail).setGroceryChecked(id,v)}
function deleteGroceryUI(id){google.script.run.withSuccessHandler(g=>{G=g;renderGroceries()}).withFailureHandler(groceryFail).deleteGroceryItem(id)}
function checkAllGroceriesUI(){if(!G.items.length)return;google.script.run.withSuccessHandler(g=>{G=g;renderGroceries()}).withFailureHandler(groceryFail).setAllGroceriesChecked(true)}

function simpleRecipeCategory_(cat,name,tags){let c=String(cat||"").trim().toLowerCase(),blob=[c,name||"",tags||""].join(" ").toLowerCase();if(/breakfast|brunch|egg|pancake|waffle|oatmeal/.test(c))return "Breakfast";if(/dessert|sweet|cake|cookie|pie|brownie|candy|ice cream/.test(c))return "Desserts";if(/sauce|condiment|dressing|marinade|rub|seasoning|crema|chimichurri|salsa|gravy/.test(c))return "Sauces";if(/app|appetizer|starter|snack|dip|finger food/.test(c))return "Apps";if(/soup|stew|chowder|bisque|salad/.test(c))return "Soups & Salads";if(/side|vegetable|veggie|potato|rice|bread|slaw/.test(c))return "Sides";if(/drink|beverage|cocktail|mocktail|smoothie|shake/.test(c))return "Drinks";if(/main|dinner|entree|entrée|beef|chicken|pork|turkey|seafood|fish|shrimp|steak|bbq|barbecue|smoker|grill|mexican|italian|asian|casserole|pasta|sandwich|burger|taco|pizza/.test(c)||/\b(chicken|beef|pork|steak|fish|shrimp|turkey|salmon|taco|burger|pasta|pizza)\b/.test(blob))return "Mains";return "Other"}

function kitchenRecipeRows_(){let out=[],seen=new Set();(R.recipes||[]).forEach(x=>{let k=String(x.name||"").trim().toLowerCase();if(!k)return;seen.add(k);out.push(Object.assign({},x,{_source:"library",_displayStatus:x.status||"Family Recipe"}))});(MP.recipes||[]).forEach(x=>{let k=String(x.name||"").trim().toLowerCase();if(!k||seen.has(k))return;seen.add(k);out.push(Object.assign({},x,{category:x.category||"Mains",yield:x.servings?x.servings+" servings":"",status:x.planName||"Meal Plan",_source:"plan",_displayStatus:x.planName||"Meal Plan"}))});(MP.flavors||[]).forEach(x=>{let k=String(x.name||"").trim().toLowerCase();if(!k||seen.has(k))return;seen.add(k);out.push(Object.assign({},x,{category:"Sauces",status:"Flavor Library",_source:"flavor",_displayStatus:"Flavor Library"}))});return out.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")))}
function ensureKitchenData_(cb){let pending=0,finished=false,done=()=>{if(pending>0)return;if(finished)return;finished=true;cb&&cb()};if(!R.loaded){pending++;google.script.run.withSuccessHandler(d=>{R=d||{recipes:[]};R.loaded=!!R.ok;pending--;done()}).withFailureHandler(e=>{pending--;recipeDataFail(e.message||e)}).getRecipeLibrary()}if(!MP.loaded){pending++;google.script.run.withSuccessHandler(d=>{MP=d||{plans:[],recipes:[],flavors:[]};MP.loaded=!!MP.ok;pending--;done()}).withFailureHandler(()=>{MP={plans:[],recipes:[],flavors:[],loaded:true};pending--;done()}).getMealPlans()}done()}

const RECIPE_SCALE_KEY="familyDashboardRecipeScalesV814",RECENT_COOKED_KEY="familyDashboardRecentCookedV814";

function recipeScaleKey_(source,id){return String(source||"library")+":"+String(id||"")}
function recipeScaleFor_(source,id){let n=Number(recipeScales[recipeScaleKey_(source,id)]||1);return [0.5,1,1.5,2,3].includes(n)?n:1}
function saveRecipeScales_(){try{localStorage.setItem(RECIPE_SCALE_KEY,JSON.stringify(recipeScales))}catch(e){}}
function formatScaledQty_(n){if(!isFinite(n))return "";let whole=Math.floor(n+1e-9),frac=n-whole,fracs=[[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[.667,"⅔"],[.75,"¾"],[.875,"⅞"]],best=fracs.reduce((a,b)=>Math.abs(frac-b[0])<Math.abs(frac-a[0])?b:a,[0,""]);if(Math.abs(frac-best[0])>.035)return String(Math.round(n*100)/100);return (whole?whole+" ":"")+best[1]||String(whole)}
function scaleIngredientLine_(line,factor){if(factor===1)return line;let s=String(line||""),m=s.match(/^(\s*)(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])(?=\s|$)/);if(!m)return s;let n=cookNum_(m[2].replace("⅓",".333").replace("⅔",".667").replace("⅛",".125").replace("⅜",".375").replace("⅝",".625").replace("⅞",".875"));if(!isFinite(n))return s;return m[1]+formatScaledQty_(n*factor)+s.slice(m[0].length)}
function scaleIngredientText_(text,factor){return String(text||"").split("\n").map(x=>scaleIngredientLine_(x,factor)).join("\n")}
function recipeScaleControlsHtml_(source,id){let cur=recipeScaleFor_(source,id);return `<span>Scale</span>${[[.5,"½×"],[1,"1×"],[1.5,"1½×"],[2,"2×"],[3,"3×"]].map(x=>`<button class="btn ${cur===x[0]?"active":""}" onclick="setRecipeScale_('${source}','${esc(id)}',${x[0]},this)">${x[1]}</button>`).join("")}`}
function setRecipeScale_(source,id,factor,btn){recipeScales[recipeScaleKey_(source,id)]=Number(factor)||1;saveRecipeScales_();let bar=btn?.closest(".recipeScaleBar");bar?.querySelectorAll(".btn").forEach(b=>b.classList.remove("active"));btn?.classList.add("active");let x=recipeBySource_(source,id),e=document.getElementById("recipeScaledIngredients");if(x&&e)e.textContent=scaleIngredientText_(x.ingredients||"—",factor)}
function recentCooked_(){try{return JSON.parse(localStorage.getItem(RECENT_COOKED_KEY)||"[]")||[]}catch(e){return[]}}
function recordRecentCooked_(recipe){if(!recipe)return;let a=recentCooked_().filter(x=>!(x.source===recipe.source&&String(x.id)===String(recipe.id)));a.unshift({source:recipe.source,id:recipe.id,name:recipe.name,at:Date.now()});try{localStorage.setItem(RECENT_COOKED_KEY,JSON.stringify(a.slice(0,12)))}catch(e){}}

function openRecipeDetail(id){let x=(R.recipes||[]).find(r=>r.id===id);if(!x)return;document.getElementById("recipeTools").style.display="none";let sc=recipeScaleFor_("library",x.id);document.getElementById("recipeBody").innerHTML=`<div class="recipeDetail"><button class="btn" onclick="${recipeView==='build'?'renderBuildWeek()':"document.getElementById('recipeTools').style.display='flex';renderRecipeLibrary()"}">← ${recipeView==='build'?'Build My Week':'Recipe Library'}</button><h2>${esc(x.name)}</h2><div class="rMeta">${esc(recipeDisplayCategory_(x))}${x.yield?` • Yield: ${esc(x.yield)}`:""}${x.status?` • ${esc(x.status)}`:""}</div>${x.tags?`<div class="rTags">${esc(x.tags)}</div>`:""}<div class="recipeScaleBar">${recipeScaleControlsHtml_('library',x.id)}</div><div class="recipeManageActions"><button class="btn cookModeBtn" onclick="openCookMode('library','${esc(x.id)}',recipeScaleFor_('library','${esc(x.id)}'))">👨‍🍳 Start Cook Mode</button><button class="btn" onclick="openRecipeGroceryPreview('library','${esc(x.id)}',recipeScaleFor_('library','${esc(x.id)}'))">🛒 Add Ingredients</button><button class="btn" onclick="openRecipeEditor('${esc(x.id)}')">✏️ Edit Recipe</button><button class="btn" onclick="duplicateRecipeUI('${esc(x.id)}')">⧉ Duplicate as New</button></div><h3>INGREDIENTS</h3><div id="recipeScaledIngredients" class="recipeText">${esc(scaleIngredientText_(x.ingredients||"—",sc))}</div><h3>INSTRUCTIONS</h3><div class="recipeText">${esc(x.instructions||"—")}</div>${x.notes?`<h3>NOTES</h3><div class="recipeText">${esc(x.notes)}</div>`:""}${x.variantOf?`<div class="rMeta" style="margin-top:18px">Variant of ${esc(x.variantOf)}</div>`:""}</div>`}

function importCleanLines_(raw){return String(raw||"").replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean)}
function importIsIngredient_(x){return /^(?:[-•*]\s*)?(?:(?:\d+\s+)?\d+\/\d+|\d+(?:\.\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞]|one|two|three|four|five|six|a\s|an\s|pinch\b|dash\b|salt\b|pepper\b)/i.test(x)&&!/^\d+[.)]\s+[A-Z][a-z]+\s+(?:the|a|an)\b/.test(x)}
function importIsStep_(x){return /^(?:step\s*)?\d+[.)\-:]\s*/i.test(x)||/^(?:preheat|heat|add|combine|mix|stir|whisk|cook|bake|roast|grill|smoke|place|pour|season|remove|transfer|reduce|bring|cover|uncover|serve|let|rest|chill|refrigerate|fold|beat|slice|cut)\b/i.test(x)}
function guessImportCategory_(name,ingredients,raw){let b=[name,ingredients,raw].join(" ").toLowerCase();if(/breakfast|brunch|pancake|waffle|oatmeal|frittata|breakfast burrito/.test(b))return "Breakfast";if(/cake|cookie|brownie|pie|dessert|frosting|ice cream|pudding|cheesecake/.test(b))return "Desserts";if(/\b(sauce|chimichurri|crema|dressing|marinade|rub|seasoning|gravy|salsa)\b/.test(name.toLowerCase()))return "Sauces";if(/\b(appetizer|dip|crostini|bruschetta|deviled egg|slider)\b/.test(b))return "Apps";if(/\b(soup|chowder|bisque|salad)\b/.test(name.toLowerCase()))return "Soups & Salads";if(/\b(side|slaw|mashed|potatoes|vegetables|corn|rice|stuffing)\b/.test(name.toLowerCase()))return "Sides";if(/\b(cocktail|mocktail|drink|smoothie|lemonade)\b/.test(name.toLowerCase()))return "Drinks";return "Mains"}
function parseRecipeImport_(raw){let lines=importCleanLines_(raw),name="",yieldText="",ingredients=[],steps=[],notes=[],mode="";let heads=/^(ingredients?|what you(?:'|’)ll need)\s*:?$/i,stepHeads=/^(instructions?|directions?|method|preparation|steps?)\s*:?$/i,noteHeads=/^(notes?|tips?)\s*:?$/i;for(let i=0;i<lines.length;i++){let x=lines[i];if(heads.test(x)){mode="ing";continue}if(stepHeads.test(x)){mode="step";continue}if(noteHeads.test(x)){mode="note";continue}if(!name&&i<3&&!/^(prep|cook|total)\s*time/i.test(x)&&x.length<100){name=x.replace(/^#+\s*/,"");continue}if(!yieldText&&/^(?:yield|serves?|servings?)\s*:?\s*/i.test(x)){yieldText=x.replace(/^(?:yield|serves?|servings?)\s*:?\s*/i,"");if(/^\d/.test(yieldText))yieldText="Serves "+yieldText;continue}if(/^(?:prep|cook|total)\s*time\s*:/i.test(x)){notes.push(x);continue}if(mode==="ing"){if(importIsStep_(x)&&ingredients.length){mode="step";steps.push(x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""));continue}ingredients.push(x.replace(/^[-•*]\s*/,""));continue}if(mode==="step"){steps.push(x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""));continue}if(mode==="note"){notes.push(x);continue}if(importIsIngredient_(x)&&!steps.length){ingredients.push(x.replace(/^[-•*]\s*/,""));mode="ing"}else if(importIsStep_(x)){steps.push(x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""));mode="step"}else notes.push(x)}if(!ingredients.length||!steps.length){let split=lines.findIndex(x=>stepHeads.test(x));if(split>0){let h=lines.findIndex(x=>heads.test(x));if(h>=0)ingredients=lines.slice(h+1,split).map(x=>x.replace(/^[-•*]\s*/,""));steps=lines.slice(split+1).filter(x=>!noteHeads.test(x)).map(x=>x.replace(/^(?:step\s*)?\d+[.)\-:]?\s*/i,""))}}return {name:name||"Imported Recipe",category:guessImportCategory_(name,ingredients.join(" "),raw),yield:yieldText,tags:"",status:"",variantOf:"",ingredients:ingredients.join("\n"),instructions:steps.join("\n"),notes:notes.join("\n"),imported:true}}
function parseRecipeImportUI(){let raw=document.getElementById("recipeImportText")?.value||"";if(raw.trim().length<20){alert("Paste a little more of the recipe first.");return}let d=parseRecipeImport_(raw);openRecipeEditor(null,false,d)}
function openRecipeEditor(id,duplicate,seed){let x=id?(R.recipes||[]).find(r=>r.id===id):null,editing=!!x&&!duplicate,d=x?JSON.parse(JSON.stringify(x)):(seed||{name:"",category:"",variantOf:"",tags:"",yield:"",ingredients:"",instructions:"",notes:"",status:""});if(duplicate){d.name=(d.name||"Recipe")+" — Copy";d.id="";d.sourceSheet="";d.sourceRow=0}document.getElementById("recipeTools").style.display="none";let cats=SIMPLE_RECIPE_CATEGORIES,editorCat=editing?recipeDisplayCategory_(d):(SIMPLE_RECIPE_CATEGORIES.includes(d.category)?d.category:"Mains");document.getElementById("recipeBody").innerHTML=`<div class="recipeEditor"><div class="recipeEditorHead"><div><h2>${editing?'✏️ Edit Recipe':'＋ Add Recipe'}</h2><div class="rMeta">Paste whole ingredient lists and instructions — one item or step per line works perfectly with Cook Mode.</div>${seed?.imported?`<div class="importReview">✓ Import parsed. Review everything below before saving.</div>`:""}${editing?`<div class="recipeSource">Stored in ${esc(d.sourceSheet||'recipe workbook')}</div>`:''}</div><button class="btn" onclick="${editing?`openRecipeDetail('${esc(d.id)}')`:`document.getElementById('recipeTools').style.display='flex';renderRecipeLibrary()`}">Cancel</button></div><div class="recipeFormGrid"><div class="recipeField full"><label>RECIPE NAME <span class="requiredStar">*</span></label><input id="reName" value="${esc(d.name||'')}" autocomplete="off" placeholder="e.g. Smoked Chile Colorado"></div><div class="recipeField"><label>CATEGORY</label><select id="reCategory">${cats.map(c=>`<option value="${esc(c)}" ${c===editorCat?"selected":""}>${esc(c)}</option>`).join("")}</select></div><div class="recipeField"><label>YIELD / SERVINGS</label><input id="reYield" value="${esc(d.yield||'')}" placeholder="e.g. Serves 4"></div><div class="recipeField"><label>TAGS</label><input id="reTags" value="${esc(d.tags||'')}" placeholder="smoker, spicy, weeknight"></div><div class="recipeField"><label>STATUS</label><input id="reStatu function voiceSportsToday_(d){if(!SPORTS.ok)return"";let k=key(d),games=(SPORTS.teams||[]).filter(t=>t.next&&key(new Date(t.next.date))===k);if(!games.length)return"";return games.map(t=>`${t.shortName||t.name} play ${sportsOpponentText_(t.next)} at ${new Date(t.next.date).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`).join(". ")+"."}

function handleVoiceCommand_(raw){
 let s=String(raw||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[?.!,]/g,"").replace(/\s+/g," ").trim(),m;
 let n=s.replace(/what's/g,"what is").replace(/that's/g,"that is").replace(/i'm/g,"i am").replace(/\bplease\b/g,"").replace(/\s+/g," ").trim();
 if(/stop listening|voice off|microphone off|stop voice/.test(n)){stopVoiceSession(false);return true}
 if((m=n.match(/(?:start|set)(?: a)? (\d+(?:\.\d+)?) (?:minute|min) timer/))){voiceStartTimer_(m[1]);return true}
 if(/^(?:stop|cancel|end)(?: the| a)? timer$|^(?:stop|silence|dismiss)(?: the)? alarm$/.test(n)){voiceStopTimer_();return true}
 if(/what is going on today|what do we have today|what is happening today|tell me about today|morning brief/.test(n)){speak_(voiceOverview_(new Date()));return true}
 if(/what is going on tomorrow|what do we have tomorrow|what is happening tomorrow|tell me about tomorrow/.test(n)){let d=new Date();d.setDate(d.getDate()+1);speak_(voiceOverview_(d));return true}
 if(/what is for dinner tomorrow|what are we having tomorrow|dinner tomorrow/.test(n)){let d=new Date();d.setDate(d.getDate()+1);speak_(voiceDinnerForDate_(d));return true}
 if(/what is for dinner|what are we having for dinner|dinner tonight/.test(n)){speak_(voiceDinner_());return true}
 if(/what chores are left|chores left|what chores do we have|what are the chores/.test(n)){speak_(voiceChoresForDate_(new Date()));return true}
 if(/anything due around the house|what is due around the house|household reminders|any reminders due/.test(n)){speak_(voiceReminderSummary_());return true}
 if(/what is the weather|weather today|how is the weather|temperature outside/.test(n)){speak_(voiceWeather_());return true}
 if(/when do .* play|when is .* (?:game|playing)|next .* game/.test(n)){speak_(voiceSportsNext_(voiceSportsTeamFromText_(n)));return true}
 if(/did .* win|how did .* do|what was the .* score|score of the .* game/.test(n)){speak_(voiceSportsLast_(voiceSportsTeamFromText_(n)));return true}
 if(/calendar today|schedule today|what is on the calendar today/.test(n)){speak_(voiceEvents_(new Date(),true));return true}
 if(/calendar tomorrow|schedule tomorrow|what is on the calendar tomorrow/.test(n)){let d=new Date();d.setDate(d.getDate()+1);speak_(voiceEvents_(d,false));return true}
 if((m=n.match(/add (.+?) to (?:the )?(?:grocery|groceries|grocery list)$/))){voiceAddGroceries_(m[1]);return true}
 if(/open (?:the )?grocer/.test(n)){openGroceries();speak_("Opening groceries.");return true}
 if(/open (?:the )?recipe/.test(n)){openRecipes();speak_("Opening recipes.");return true}
 if(/open (?:the )?(?:brief|morning brief)/.test(n)){openMorningBrief();speak_("Opening the morning brief.");return true}
 if(/open (?:the )?sports/.test(n)){openSportsCenter();speak_("Opening sports center.");return true}
 if(/go home|open (?:the )?dashboard/.test(n)){document.querySelectorAll("#dayOverlay,#groceryOverlay,#recipeOverlay,#cookOverlay").forEach(x=>x.classList.remove("open"));closeModal();updateCookMiniBar_();speak_("Back to the dashboard.");return true}
 if(cookRecipe){
   let steps=cookRecipe.steps||[], current=()=>steps[cookStep]||"";
   // Current step: deliberately broad, because speech recognition often drops small words.
   if(/^(?:read|say|tell me|repeat)(?: me)?(?: this| the| current)?(?: cooking)? (?:step|instruction|direction)$/.test(n)||
      /^(?:read|say|tell me|repeat)(?: this| that| it| the step| current step)$/.test(n)||
      /^(?:what is|whats) (?:this|the|current) (?:step|instruction|direction)$/.test(n)){
      speak_(`Step ${cookStep+1}. ${current()}`);return true
   }
   // Next step / what's next / continue.
   if(/^(?:what is next|whats next|what next|next|next step|next instruction|next direction|continue|keep going|move on|go on)$/.test(n)||
      /(?:read|say|tell me|give me|go to|move to|show me).*(?:next|following).*(?:step|instruction|direction)?/.test(n)){
      if(cookStep<steps.length-1)cookNextStep();speak_(`Step ${cookStep+1}. ${current()}`);return true
   }
   // Previous step.
   if(/^(?:previous|previous step|last step|back|go back|go back a step|what was the last step)$/.test(n)||
      /(?:read|say|tell me|give me|go to|move to|show me).*(?:previous|last|prior).*(?:step|instruction|direction)?/.test(n)){
      cookPrevStep();speak_(`Step ${cookStep+1}. ${current()}`);return true
   }
   if(/^(?:repeat|again|say that again|read that again|repeat that|repeat step)$/.test(n)){speak_(`Step ${cookStep+1}. ${current()}`);return true}
   if((m=n.match(/(?:read|go to|show me|tell me|step) (?:step|instruction)? ?(\d+)/))){let x=Math.max(1,Math.min(steps.length,Number(m[1])))-1;cookJumpStep(x);speak_(`Step ${x+1}. ${steps[x]||""}`);return true}
   if(/read (?:all )?(?:the )?(?:steps|instructions|directions)|read the whole recipe|read all/.test(n)){speak_(steps.map((x,i)=>`Step ${i+1}. ${x}`).join(" "));return true}
   if(/read (?:the )?ingredients|what ingredients|ingredient list/.test(n)){speak_((cookRecipe.ingredients||[]).join(". "));return true}
   if((m=n.match(/how much (.+)$/))){let x=(cookRecipe.ingredients||[]).filter(i=>i.toLowerCase().includes(m[1])).slice(0,3);speak_(x.length?x.join(". "):`I couldn't find ${m[1]} in this recipe.`);return true}
   if(/start (?:the )?timer|timer for (?:this|the current) step/.test(n)){let x=cookTimerMatches_(current());if(x.length){startCookTimer(x[0].minutes);speak_(`${x[0].label} timer started.`)}else speak_("I don't see a timer in this step.");return true}
 }
 return false
}

function cookLines_(text){return String(text||"").replace(/\r/g,"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\s*(?:step\s*)?\d+[.)\-:]?\s*/i,"").replace(/^[-•]\s*/,"").trim()).filter(Boolean)}
function cookSteps_(text){let raw=String(text||"").replace(/\r/g,"").trim();if(!raw)return ["No instructions were provided for this recipe."];let lines=cookLines_(raw);if(lines.length>1)return lines;let parts=raw.split(/(?<=[.!?])\s+(?=(?:Then|Next|Meanwhile|After|Add|Place|Cook|Bake|Roast|Grill|Smoke|Stir|Mix|Heat|Reduce|Remove|Serve|Let|Rest|Season|Pour|Transfer|Return|Cover|Uncover)\b)/i).map(x=>x.trim()).filter(Boolean);return parts.length?parts:[raw]}
function cookIngredients_(text){return String(text||"—").replace(/\r/g,"").split(/(?:\n+|;\s*)/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[-•]\s*/,"").trim()).filter(Boolean)}
function cookNum_(v){v=String(v||"").trim().replace("½",".5").replace("¼",".25").replace("¾",".75");if(/^\d+\s+\d+\/\d+$/.test(v)){let a=v.split(/\s+/),f=a[1].split("/");return Number(a[0])+Number(f[0])/Number(f[1])}if(/^\d+\/\d+$/.test(v)){let f=v.split("/");return Number(f[0])/Number(f[1])}return Number(v)}
function cookTimerMatches_(text){let out=[],re=/\b(?:about\s+|approximately\s+|approx\.?\s+)?(\d+(?:\.\d+)?|\d+\s+\d+\/\d+|\d+\/\d+|\d*\s*[½¼¾])(?:\s*(?:-|–|to)\s*(\d+(?:\.\d+)?|\d+\s+\d+\/\d+|\d+\/\d+|\d*\s*[½¼¾]))?\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)\b/gi,m;while((m=re.exec(String(text||"")))){let a=cookNum_(m[1]),b=m[2]?cookNum_(m[2]):null,n=b||a,u=m[3].toLowerCase(),mins=u.startsWith("h")?n*60:u.startsWith("s")?n/60:n;if(mins>=.25&&mins<=720&&!out.some(x=>Math.abs(x.minutes-mins)<.001))out.push({minutes:mins,label:m[0].trim()})}return out.slice(0,4)}

function likelyDinner_(r){let c=String(r.category||"").toLowerCase(),t=String(r.tags||"").toLowerCase();if(/breakfast|side|sauce|injection|finisher|topping/.test(c)&&!/(main)/.test(c))return false;if(/appetizer/.test(c)&&!/(main)/.test(c))return false;return /main|bbq|seafood|entree|dinner/.test(c)||/(chicken|beef|pork|turkey|seafood|shrimp|scallop|lasagna|skillet)/.test(t)}

function plannerPool_(type,planId,current){let rows=(MP.recipes||[]).filter(r=>String(r.meal||"").toLowerCase()===type);if(planId&&planId!=="__mix__")rows=rows.filter(r=>r.planId===planId);if(current)rows=rows.filter(r=>r.id!==current);let seen=new Set();return rows.filter(r=>{let k=String(r.name||"").toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true})}
function plannerPick_(type,planId,used){let pool=plannerPool_(type,planId).filter(r=>!used.has(String(r.name||"").toLowerCase()));if(!pool.length)pool=plannerPool_(type,planId);if(!pool.length)return null;return pool[Math.floor(Math.random()*pool.length)]}
function renderBuildWeek(){let b=document.getElementById("recipeBody"),today=new Date(),iso=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0"),plans=plannerPlanOptions_();b.innerHTML=`<div class="buildPanel"><h2 style="margin-top:0">🧩 Meal Planning 2.0</h2><div class="rMeta" style="margin-bottom:12px">Build one week from a single 30-day plan or mix the whole Kitchen Brain. Choose the meals you want, swap anything that doesn't sound good, scale the household, then send the finished week to Menu + Groceries.</div><div class="buildControls" style="flex-wrap:wrap"><div><label>START DATE</label><input id="plannerStartDate" type="date" value="${iso}"></div><div><label>RECIPE SOURCE</label><select id="plannerPlan">${plans.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></div><div><label>HOUSEHOLD SCALE</label><select id="plannerScale"><option value="0.5">½×</option><option value="1" selected>1× (2 servings)</option><option value="1.5">1½×</option><option value="2">2×</option><option value="3">3×</option></select></div><label class="plannerMealToggle plannerBreakfast"><input id="plannerBreakfast" type="checkbox" checked style="width:auto"> Breakfast</label><label class="plannerMealToggle plannerLunch"><input id="plannerLunch" type="checkbox" checked style="width:auto"> Lunch</label><label class="plannerMealToggle plannerDinner"><input id="plannerDinner" type="checkbox" checked style="width:auto"> Dinner</label><button class="btn plannerBuildBtn" onclick="generatePlannerWeek()">✨ Build 7 Days</button></div><div id="plannerPreview"></div></div>`;if(randomDinnerDraft.length&&randomDinnerDraft[0]?.plannerV91)renderPlannerPreview()}
function generatePlannerWeek(){let iso=document.getElementById("plannerStartDate")?.value,planId=document.getElementById("plannerPlan")?.value||"__mix__",scale=Number(document.getElementById("plannerScale")?.value||1),types=[];if(document.getElementById("plannerBreakfast")?.checked)types.push("breakfast");if(document.getElementById("plannerLunch")?.checked)types.push("lunch");if(document.getElementById("plannerDinner")?.checked)types.push("dinner");if(!iso||!types.length){alert("Choose a start date and at least one meal type.");return}let used={breakfast:new Set(),lunch:new Set(),dinner:new Set()};randomDinnerDraft=[];for(let i=0;i<7;i++){let dt=localDate_(iso,i),d={plannerV91:true,date:dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"),planId:planId,scale:scale};types.forEach(type=>{let x=plannerPick_(type,planId,used[type]);if(x){d[type]=x.name;d[type+"Id"]=x.id;d[type+"PlanId"]=x.planId;used[type].add(String(x.name||"").toLowerCase())}});randomDinnerDraft.push(d)}renderPlannerPreview()}
function plannerMealHtml_(d,i,type,icon,label){if(!d[type])return "";let r=(MP.recipes||[]).find(x=>x.id===d[type+"Id"]),meta=r?[r.calories?`${r.calories} cal`:"",r.protein?`${r.protein}g protein`:""].filter(Boolean).join(" • "):"";return `<div class="weekMeal" style="align-items:center"><span style="flex:1"><b>${icon} ${label}:</b> ${esc(d[type])}${meta?`<div class="rMeta">${esc(meta)}</div>`:""}</span><button class="btn reroll" onclick="openPlanRecipe('${esc(d[type+"Id"])}',true)">Recipe ›</button><button class="btn reroll" onclick="swapPlannerMeal(${i},'${type}')">↻ Swap</button><button class="btn reroll" title="Remove this meal" onclick="removePlannerMeal(${i},'${type}')">×</button></div>`}
function renderPlannerPreview(){let e=document.getElementById("plannerPreview");if(!e||!randomDinnerDraft.length)return;let scale=Number(randomDinnerDraft[0].scale||1);e.innerHTML=`<div class="loadedBadge" style="margin-top:12px">Kitchen Brain draft • ${scale===1?'2 household servings':`${scale}× recipe quantities`} • Swap or remove anything before loading.</div><div class="weekPreview">${randomDinnerDraft.map((d,i)=>`<div class="weekCard"><h3>${localDate_(d.date,0).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})}</h3>${plannerMealHtml_(d,i,"breakfast","🌅","Breakfast")}${plannerMealHtml_(d,i,"lunch","☀️","Lunch")}${plannerMealHtml_(d,i,"dinner","🌙","Dinner")}</div>`).join("")}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primaryAction" onclick="loadPlannerWeek()">🍽️ Load Week Into Menu</button><button class="btn" onclick="generatePlannerWeek()">🎲 Rebuild Entire Week</button><span class="rMeta">Loading replaces the current structured meal week, not your recipe library.</span></div>`}
function swapPlannerMeal(i,type){let d=randomDinnerDraft[i],pool=plannerPool_(type,d.planId,d[type+"Id"]);if(!pool.length){alert("No alternate recipes were found for that meal type.");return}let x=pool[Math.floor(Math.random()*pool.length)];d[type]=x.name;d[type+"Id"]=x.id;d[type+"PlanId"]=x.planId;renderPlannerPreview()}
function removePlannerMeal(i,type){let d=randomDinnerDraft[i];delete d[type];delete d[type+"Id"];delete d[type+"PlanId"];renderPlannerPreview()}
function loadPlannerWeek(){if(!randomDinnerDraft.length)return;S.mealPlanWeek=randomDinnerDraft.map(d=>({date:d.date,planId:d.planId,planName:d.planId==="__mix__"?"Mixed Kitchen Brain":"Meal Planner 2.0",scale:d.scale||1,breakfast:d.breakfast||"",breakfastId:d.breakfastId||"",lunch:d.lunch||"",lunchId:d.lunchId||"",dinner:d.dinner||"",dinnerId:d.dinnerId||""}));S.randomDinnerWeek=[];const keys=["SUN","MON","TUE","WED","THU","FRI","SAT"];S.mealPlanWeek.forEach(d=>{let k=keys[localDate_(d.date,0).getDay()],parts=[];if(d.breakfast)parts.push(`🌅 ${d.breakfast}`);if(d.lunch)parts.push(`☀️ ${d.lunch}`);if(d.dinner)parts.push(`🌙 ${d.dinner}`);S.menu[k]=parts.join("  •  ")});persist(()=>{renderDetail();renderCal();let e=document.getElementById("plannerPreview");if(e)e.insertAdjacentHTML("afterbegin",'<div class="wgSuccess">✓ Week loaded into the Family Menu. &nbsp; <button class="btn" onclick="showGroceryGenTab()">🛒 Generate This Week’s Groceries</button></div>')})}
function showGroceryGenTab(){
  recipeView="groceryGen";
  ["recipeTabBtn","planTabBtn","buildTabBtn","groceryGenTabBtn"].forEach(id=>document.getElementById(id)?.classList.remove("active"));
  document.getElementById("groceryGenTabBtn")?.classList.add("active");
  document.getElementById("recipeTools").style.display="none";
  document.getElementById("recipeBody").innerHTML='<div class="rLoading">Turning this week into a shopping attack plan…</div>';
  google.script.run.withSuccessHandler(d=>{WG=d||{items:[],recipes:[]};WG.loaded=!!WG.ok;renderWeekGroceries()}).withFailureHandler(e=>recipeDataFail(e.message||e)).getWeekGroceryPreview();
}
function renderWeekGroceries(){
  let b=document.getElementById("recipeBody");if(!WG.ok){b.innerHTML=`<div class="rEmpty"><h2>🛒 Week Groceries</h2>${esc(WG.message||"No loaded week found.")}<br><br><span class="rMeta">Load a week from Meal Plans or Plan My Week first, then come back here.</span></div>`;return}
  let warn=(WG.missing||[]).length?`<div class="wgWarning">Couldn’t match ${WG.missing.length} meal${WG.missing.length===1?"":"s"}: ${esc(WG.missing.join(", "))}</div>`:"";
  let counts=groceryIntelligenceCounts_();
  b.innerHTML=`<div class="wgPanel"><div class="wgTopline"><div><h2 style="margin:0 0 4px">🛒 Grocery + Pantry Intelligence</h2><div class="rMeta">Built from ${WG.recipes.length} recipe${WG.recipes.length===1?"":"s"}. The Kitchen Brain now checks your pantry and current shared list before deciding what you actually need.</div></div><div class="wgActions"><button class="btn primaryAction wgSendAction" onclick="sendWeekGroceries()">🛒 Add Selected to Shared Groceries</button><button class="btn primaryAction" onclick="smartSelectWeekGroceries()">🧠 Smart Select</button><button class="btn" onclick="setWeekGroceryChecks(true)">Select All</button><button class="btn" onclick="setWeekGroceryChecks(false)">None</button><button class="btn" onclick="showGroceryGenTab()">↻ Rebuild</button></div></div>${warn}<div class="giStrip"><div class="giStat giNeed"><b>${counts.need}</b>Need to buy</div><div class="giStat giListed"><b>${counts.listed}</b>Already on list</div><div class="giStat giPantry"><b>${counts.pantry}</b>Always stocked</div></div><div class="wgSummary">🧠 <b>Smart Select</b> checks only true shopping needs. Pantry items and ingredients already sitting on Shared Groceries stay unchecked automatically.</div><div id="wgList" class="wgList">${WG.items.map((x,i)=>weekGroceryRow_(x,i)).join("")}</div><div class="wgSend"><button class="btn primaryAction wgSendAction" onclick="sendWeekGroceries()">🛒 Add Selected to Shared Groceries</button><span id="wgSendStatus" class="rMeta">Existing grocery items are protected from duplicate adds.</span></div></div>`;
}
function groceryIntelligenceCounts_(){let c={need:0,listed:0,pantry:0};(WG.items||[]).forEach(x=>{if(x.stocked)c.pantry++;else if(x.alreadyOnList)c.listed++;else c.need++});return c}
function groceryStatusHtml_(x){if(x.stocked)return '<span class="wgStatus pantry">🥫 ALWAYS STOCKED</span>';if(x.alreadyOnList)return '<span class="wgStatus listed">🛒 ALREADY ON LIST</span>';return '<span class="wgStatus need">● NEED TO BUY</span>'}
function weekGroceryRow_(x,i){let checked=(!x.stocked&&!x.alreadyOnList)?"checked":"",cls=x.stocked?"stocked":(x.alreadyOnList?"alreadyListed":"");let existing=x.alreadyOnList?` <span class="wgExisting">• Current list${x.existingQty?`: ${esc(x.existingQty)}`:""}</span>`:"";return `<div class="wgRow ${cls}"><input id="wgCheck${i}" type="checkbox" ${checked}><input id="wgQty${i}" type="text" value="${esc(x.qty||"")}" placeholder="Qty"><input id="wgName${i}" type="text" value="${esc(x.name||"")}" placeholder="Ingredient"><select id="wgCat${i}">${GROCERY_CATEGORIES.map(c=>`<option ${c===x.category?"selected":""}>${esc(c)}</option>`).join("")}</select><div class="wgSources">From: ${esc(x.sourceText||"")} ${groceryStatusHtml_(x)}${existing}<button class="btn wgPantryBtn" onclick="toggleWeekPantry(${i})">${x.stocked?"Remove from Pantry":"Keep Stocked"}</button></div></div>`}
function setWeekGroceryChecks(v){WG.items.forEach((_,i)=>{let e=document.getElementById("wgCheck"+i);if(e)e.checked=v})}
function smartSelectWeekGroceries(){WG.items.forEach((x,i)=>{let e=document.getElementById("wgCheck"+i);if(e)e.checked=!x.stocked&&!x.alreadyOnList})}
function uncheckPantryWeekGroceries(){WG.items.forEach((x,i)=>{let e=document.getElementById("wgCheck"+i);if(e&&x.stocked)e.checked=false})}
function toggleWeekPantry(i){let x=WG.items[i];if(!x)return;let name=(document.getElementById("wgName"+i)?.value||x.name||"").trim();if(!name)return;let makeStocked=!x.stocked;google.script.run.withSuccessHandler(p=>{STOCK=p||STOCK;x.stocked=makeStocked;if(makeStocked)x.alreadyOnList=false;renderWeekGroceries()}).withFailureHandler(e=>alert("Pantry update failed: "+(e.message||e))).setAlwaysStockedByName(name,makeStocked)}
function sendWeekGroceries(){
  let items=WG.items.map((x,i)=>({selected:document.getElementById("wgCheck"+i)?.checked,name:(document.getElementById("wgName"+i)?.value||"").trim(),qty:(document.getElementById("wgQty"+i)?.value||"").trim(),category:document.getElementById("wgCat"+i)?.value||"Other",sourceText:x.sourceText||"Weekly meal plan"})).filter(x=>x.selected&&x.name);
  if(!items.length){alert("Nothing is selected to add.");return}
  let btn=document.querySelectorAll(".wgSendAction"),st=document.getElementById("wgSendStatus");btn.forEach(b=>{b.disabled=true;b.textContent="Adding…"});st.textContent=`Sending ${items.length} item${items.length===1?"":"s"} to the shared list…`;
  google.script.run.withSuccessHandler(g=>{G=g;btn.forEach(b=>{b.disabled=false;b.textContent="✓ Added to Groceries"});st.innerHTML=`${items.length} item${items.length===1?"":"s"} added. <button class="btn" onclick="closeRecipes();openGroceries()">Open Groceries →</button>`;let p=document.querySelector(".wgPanel");if(p)p.insertAdjacentHTML("afterbegin",'<div class="wgSuccess">✓ Grocery run generated. Existing grocery items were left alone.</div>')}).withFailureHandler(e=>{btn.forEach(b=>{b.disabled=false;b.textContent="🛒 Add Selected to Shared Groceries"});st.textContent="Error: "+(e.message||e)}).addGeneratedGroceries(items);
}

function activity(){
 let now=Date.now();
 if(now-lastActivityAt_<1500)return;
 lastActivityAt_=now;
 clearTimeout(idle);
 idle=setTimeout(()=>{closeDay();today()},120000);
}
function editingField_(e){let t=e.target;return !!(t&&(t.matches?.("input, textarea, select")||t.isContentEditable))}
document.addEventListener("keydown",e=>{secretKey(e);if(e.key==="Backspace"&&editingField_(e))return;if((e.key==="Escape"||e.key==="Backspace")&&document.getElementById("cookOverlay").classList.contains("open")){e.preventDefault();closeCookMode();return}if((e.key==="Escape"||e.key==="Backspace")&&document.getElementById("recipeOverlay").classList.contains("open")){e.preventDefault();closeRecipes();return}if((e.key==="Escape"||e.key==="Backspace")&&document.getElementById("groceryOverlay").classList.contains("open")){e.preventDefault();closeGroceries();return}if((e.key==="Escape"||e.key==="Backspace")&&document.getElementById("dayOverlay").classList.contains("open")){e.preventDefault();closeDay()}});["click","keydown","mousemove"].forEach(e=>document.addEventListener(e,activity,{passive:true}));

 if(weatherLoadInFlight_)return;
 weatherLoadInFlight_=true;
 google.script.run
  .withSuccessHandler(w=>{
   weatherLoadInFlight_=false;
   W=w;
   renderDetail();
   let mw=document.getElementById("mainWeather");
   if(mw){
    if(W&&W.ok&&W.current){
     mw.innerHTML=`<span class="weatherPrimary">${icon(W.current.weather_code)} ${Math.round(W.current.temperature_2m)}°</span><span class="weatherSecondary">Feels ${Math.round(W.current.apparent_temperature)}° • ${esc(W.location)}</span>`;
    }else mw.innerHTML='<span class="weatherSecondary">Weather unavailable</span>';
   }
   let wr=document.getElementById("weatherReaction");if(wr)wr.textContent=weatherReactionText();
   let fm=document.getElementById("fridayMode");if(fm)fm.textContent=fridayModeText();
   renderCountdowns();
   if(document.getElementById("dayOverlay")?.classList.contains("open"))openDay(sel);
   maybeAutoOpenMorningBrief_();
  })
  .withFailureHandler(()=>{weatherLoadInFlight_=false;setTimeout(maybeAutoOpenMorningBrief_,600)})
  .getWeather();
}
function load(force=false){
 if(coreLoadInFlight_)return;
 if(!force&&!dashboardVisible_())return;
 coreLoadInFlight_=true;
 google.script.run
  .withSuccessHandler(x=>{
   coreLoadInFlight_=false;
   lastCoreRefreshAt_=Date.now();
   let newSig=calendarSignature_(x),calendarChanged=(newSig!==lastCalendarSignature_);
   D=x;S=x.settings;
   S.dailyCelebrations=S.dailyCelebrations||{};
   S.streakRewards=S.streakRewards||{};
   S.pinnedNotes=S.pinnedNotes||[];
   document.getElementById("sync").textContent="Synced "+new Date().toLocaleTimeString();
   document.getElementById("load").style.display="none";
   if(calendarChanged){
    lastCalendarSignature_=newSig;
    renderCal();
   }
   renderDetail();
   renderGlance();
   renderCountdowns();
   maybeTriggerTodaySpecial_();
   refreshPantry();
   loadSports(false);
   loadWeather();
   activity();
  })
  .withFailureHandler(e=>{
   coreLoadInFlight_=false;
   document.getElementById("load").textContent="Error: "+e.message;
  })
  .getInitialData();
}
